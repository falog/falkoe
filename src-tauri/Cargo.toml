[package]
name = "falkoe"
version = "0.3.8"
description = "Falkoe Voice-powered language learning app"
authors = ["fal"]
license = "GPL-3.0-or-later"
edition = "2021"
default-run = "falkoe"

[[bin]]
name = "world_pitch"
path = "src/bin/world_pitch.rs"



[lib]
name = "falkoe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"
cpal = "0.16.0"
hound = "3.4.0"
once_cell = "1.19"
tauri-plugin-mic-recorder = { path = "vendor/tauri-plugin-mic-recorder", optional = true }
tauri-plugin-shell = "2"
anyhow = "1.0"
log = { version = "0.4", features = ["std"] }
rubato = "0.16.2"
ureq = "2"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json", "stream"] }
dirs = "5"
chrono = "0.4"
whisper-rs = { version = "0.15.1", default-features = false, features = ["log_backend"], optional = true }
base64 = "0.21"
sha2 = "0.10"

[features]
default = ["whisper", "mic-recorder"]

# Speech recognition / Whisper backend. Disabled builds can still run the app,
# but transcription-related commands will return an error.
whisper = ["dep:whisper-rs"]

# Desktop-only mic recorder plugin (not yet supported on mobile targets).
mic-recorder = ["dep:tauri-plugin-mic-recorder"]

# Convenience feature for “Android first” builds.
# Use with: cargo check --no-default-features --features android-mvp
android-mvp = ["mic-recorder"]

openmp = ["whisper", "whisper-rs/openmp"]
no-openmp = []

# Optional Whisper GPU backends.
# Note: these are optional build-time features. Distribution builds should keep a CPU-only
# variant for maximum compatibility.
whisper-vulkan = ["whisper", "whisper-rs/vulkan"]
whisper-metal = ["whisper", "whisper-rs/metal"]

[patch.crates-io]
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }
