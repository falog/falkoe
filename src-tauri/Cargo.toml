[package]
name = "falkoe"
version = "0.3.8"
description = "Falkoe Voice-powered language learning app"
authors = ["fal"]
license = "GPL-3.0-or-later"
edition = "2021"
default-run = "falkoe"

[[bin]]
name = "world_pitch"
path = "src/bin/world_pitch.rs"



[lib]
name = "falkoe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"
hound = "3.4.0"
once_cell = "1.19"
tauri-plugin-mic-recorder = { path = "vendor/tauri-plugin-mic-recorder", optional = true }
tauri-plugin-shell = "2"
anyhow = "1.0"
log = { version = "0.4", features = ["std"] }
rubato = "0.16.2"
ureq = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "stream"] }
dirs = "5"
chrono = "0.4"
whisper-rs = { version = "0.15.1", default-features = false, features = ["log_backend"], optional = true }
base64 = "0.21"
sha2 = "0.10"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[features]
# Keep defaults mobile-friendly. `tauri android dev` doesn't support
# `--no-default-features`, so defaults must not pull heavy/native deps like Whisper.
#
# Note: we keep `mic-recorder` in defaults to satisfy the app capability
# (`mic-recorder:default`) and to preserve recording behavior where supported.
default = ["mic-recorder"]

# Full desktop experience (previous default).
desktop = ["whisper", "mic-recorder"]

# Speech recognition / Whisper backend. Disabled builds can still run the app,
# but transcription-related commands will return an error.
whisper = ["dep:whisper-rs"]

# Desktop-only mic recorder plugin (not yet supported on mobile targets).
mic-recorder = ["dep:tauri-plugin-mic-recorder"]

# Convenience feature for “Android first” builds.
# (Defaults are already minimal; this is kept for readability / CI scripts.)
android-mvp = []

openmp = ["whisper", "whisper-rs/openmp"]
no-openmp = []

# Optional Whisper GPU backends.
# Note: these are optional build-time features. Distribution builds should keep a CPU-only
# variant for maximum compatibility.
whisper-vulkan = ["whisper", "whisper-rs/vulkan"]
whisper-metal = ["whisper", "whisper-rs/metal"]

# ---------------------------------------------------------------------------
# Profile tweaks
# ---------------------------------------------------------------------------

# The ARM64 debug .so is ~185 MB with full debuginfo, which inflates the
# debug APK to ~368 MB.  On Android the WebView process has a 268 MB
# heap ceiling, so _any_ native handler that tries to buffer the APK
# (e.g. the Tauri dev-proxy protocol) triggers an immediate OOM.
#
# Stripping debuginfo from the dev profile shrinks the .so by roughly 5–8×
# and keeps the debug APK safely below the heap limit.
[profile.dev]
strip = "debuginfo"

[patch.crates-io]
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }
