[package]
name = "falkoe"
version = "0.1.1"
description = "Falkoe Tauri Application"
authors = ["fal"]
edition = "2021"

[lib]
name = "falkoe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"
cpal = "0.16.0"
hound = "3.4.0"
once_cell = "1.19"
tauri-plugin-mic-recorder = "2.0.0"
tauri-plugin-shell = "2"
anyhow = "1.0"
log = "0.4"
rubato = "0.16.2"
ureq = "2"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"] }
dirs = "5"
chrono = "0.4"

# デフォルトの whisper-rs (Linux, Windows, macOS x86_64 用)
[target.'cfg(not(all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
whisper-rs = "0.15.1"

# macOS ARM64 専用の whisper-rs 設定
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
whisper-rs = "0.15.1"
