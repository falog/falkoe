name: Build and Release Falkoe

on:
  push:
    branches: [main]
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare_mecab_ipadic:
    runs-on: ubuntu-latest
    steps:
      - name: Install MeCab + IPADIC (UTF-8)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt install -y mecab mecab-ipadic-utf8

      - name: Collect IPADIC dictionary files
        shell: bash
        run: |
          set -euo pipefail

          out_dir="/tmp/mecab_ipadic_artifact"
          rm -rf "$out_dir"
          mkdir -p "$out_dir"

          dic_dir=""
          for candidate in \
            /var/lib/mecab/dic/ipadic-utf8 \
            /usr/share/mecab/dic/ipadic-utf8 \
            /var/lib/mecab/dic/ipadic \
            /usr/share/mecab/dic/ipadic
          do
            if [[ -d "$candidate" && -f "$candidate/dicrc" ]]; then
              dic_dir="$candidate"
              break
            fi
          done

          if [[ -z "$dic_dir" ]]; then
            echo "[error] ipadic dicdir not found" >&2
            exit 1
          fi

          cp -RL "$dic_dir"/* "$out_dir/"

          for file in dicrc sys.dic unk.dic; do
            if [[ ! -f "$out_dir/$file" ]]; then
              echo "[error] missing required dic file: $file" >&2
              exit 1
            fi
          done

          echo "[info] collected ipadic from: $dic_dir"
          ls -lh "$out_dir" | head -n 30

      - name: Upload IPADIC dictionary artifact
        uses: actions/upload-artifact@v4
        with:
          name: mecab-ipadic-utf8
          path: /tmp/mecab_ipadic_artifact

  build:
    needs: prepare_mecab_ipadic
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.canary || false }}
    env:
      ARTIFACT_NAME: ${{ matrix.artifact_name }}
      FALKOE_BUNDLE_TRANSCRIBE_HELPERS: ${{ matrix.bundle_transcribe_helpers || '' }}
      FALKOE_BUILD_VULKAN_HELPER: ${{ matrix.build_vulkan_helper || '' }}
      FALKOE_REQUIRE_VULKAN_HELPER: ${{ matrix.require_vulkan_helper || '' }}
      FALKOE_BUILD_METAL_HELPER: ${{ matrix.build_metal_helper || '' }}
      FALKOE_REQUIRE_METAL_HELPER: ${{ matrix.require_metal_helper || '' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Default CPU builds
          - os: ubuntu-latest
            variant: default
            canary: false
            artifact_name: falkoe-ubuntu-latest
            needs_vulkan_deps: "1"
            bundle_transcribe_helpers: "1"
            build_vulkan_helper: "1"
            require_vulkan_helper: "1"
          - os: windows-latest
            variant: default
            canary: false
            artifact_name: falkoe-windows-latest
          - os: macos-14
            variant: default
            canary: false
            artifact_name: falkoe-macos-14
            bundle_transcribe_helpers: "1"
            build_metal_helper: "1"
            require_metal_helper: "1"

          # Canary builds (macos-latest)
          - os: macos-latest
            variant: default
            canary: true
            artifact_name: falkoe-macos-latest-canary
            bundle_transcribe_helpers: "1"
            build_metal_helper: "1"
            require_metal_helper: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download IPADIC dictionary (shared)
        if: matrix.os == 'windows-latest'
        uses: actions/download-artifact@v4
        with:
          name: mecab-ipadic-utf8
          path: src-tauri/resources/mecab/ipadic

      # ========================================
      # 依存関係インストール
      # ========================================

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libasound2-dev \
            build-essential \
            ffmpeg \
            mecab \
            mecab-ipadic-utf8

          if [[ "${{ matrix.needs_vulkan_deps || '' }}" == "1" ]]; then
            sudo apt install -y cmake libvulkan-dev
            sudo apt install -y glslc || sudo apt install -y shaderc || sudo apt install -y shaderc-tools
            command -v glslc
          fi

      - name: Install tools (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: choco install -y ffmpeg

      - name: Install Vulkan SDK (Windows)
        if: matrix.os == 'windows-latest' && matrix.variant == 'default'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          winget --version
          winget install --id KhronosGroup.VulkanSDK -e --silent --accept-package-agreements --accept-source-agreements

          $sdk = Get-ChildItem -Path 'C:\VulkanSDK' -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $sdk) {
            throw "Vulkan SDK install succeeded but C:\\VulkanSDK was not found"
          }

          "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PATH=$($sdk.FullName)\\Bin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          & "$($sdk.FullName)\\Bin\\glslc.exe" --version

      - name: Setup MSYS2 (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-mecab
            mingw-w64-x86_64-gettext

      - name: Verify MeCab installation (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          pacman -S --noconfirm --needed mingw-w64-x86_64-mecab mingw-w64-x86_64-gettext
          echo "[info] mecab packages:" 
          pacman -Q | grep -i mecab || true
          echo "[info] mecab location:" 
          command -v mecab || true

      - name: Install tools (macOS)
        if: startsWith(matrix.os, 'macos-')
        run: |
          brew update
          brew install ffmpeg mecab mecab-ipadic

      # ========================================
      # バンドル処理: ffmpeg
      # ========================================

      - name: Bundle ffmpeg
        uses: ./.github/actions/bundle-ffmpeg

      # ========================================
      # バンドル処理: WORLD helper
      # ========================================

      - name: Build + bundle WORLD helper
        uses: ./.github/actions/bundle-world

      # ========================================
      # バンドル処理: Praat
      # ========================================

      - name: Bundle Praat
        uses: ./.github/actions/bundle-praat

      # ========================================
      # バンドル処理: MeCab
      # ========================================

      - name: Bundle MeCab
        uses: ./.github/actions/bundle-mecab

      # ========================================
      # Node / pnpm setup
      # ========================================

      - name: Verify bundled tools
        uses: ./.github/actions/verify-bundled-tools

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # ========================================
      # Rust setup
      # ========================================

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Preflight permissions (macOS)
        if: startsWith(matrix.os, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d src-tauri/resources ]]; then
            echo "[error] src-tauri/resources not found"
            exit 1
          fi

          echo "[info] quick resource permission diagnostics"
          ls -la src-tauri/resources || true
          ls -la src-tauri/resources/bin || true
          if [[ -d src-tauri/resources/bin/Praat.app ]]; then
            ls -la src-tauri/resources/bin/Praat.app/Contents/MacOS || true
          fi
          find src-tauri/resources/bin -maxdepth 6 -type l -print 2>/dev/null || true

          echo "[info] normalizing permissions"
          chmod -R u+rwX,go+rX src-tauri/resources || true

      # ========================================
      # Build
      # ========================================

      - name: Build Tauri app (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm tauri build

      - name: Build Tauri app (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        env:
          CARGO_TARGET_DIR: D:\t
          FALKOE_BUILD_VULKAN_HELPER: "1"
          FALKOE_REQUIRE_VULKAN_HELPER: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force 'D:\t' | Out-Null

          pnpm tauri build

          $src = 'D:\t\release\bundle'
          $dst = 'src-tauri\target\release\bundle'
          if (-not (Test-Path $src)) { throw "Expected bundle directory not found: $src" }
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item -Recurse -Force "$src\*" $dst

      - name: Build Tauri app (macOS)
        if: startsWith(matrix.os, 'macos-')
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          CMAKE_OSX_DEPLOYMENT_TARGET: "11.0"
          CMAKE_ARGS: "-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
          GGML_NO_OPENMP: "1"
          WHISPER_NO_OPENMP: "1"
          RUST_BACKTRACE: "1"
        run: pnpm tauri build -- --features no-openmp

      # ========================================
      # バージョン取得（統一ロジック）
      # ========================================

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version=""
          # タグビルドの場合は、タグから優先的にバージョンを取得
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME:-}"
            version="${version#v}"
          fi

          # タグがない場合はCargo.tomlから取得
          if [[ -z "$version" ]]; then
            # Prefer Rust crate version for non-tag builds.
            # (Avoid relying on node being available, and keep versioning consistent with src-tauri.)
            version="$(awk '
              $0=="[package]" { in_pkg=1; next }
              /^\[/ { in_pkg=0 }
              in_pkg && $0 ~ /^version[[:space:]]*=/ {
                line=$0
                sub(/^[^"]*"/, "", line)
                sub(/".*$/, "", line)
                print line
                exit
              }
            ' src-tauri/Cargo.toml | head -n 1)"
            # Normalize potential CRLF/newline.
            version="$(printf '%s' "$version" | tr -d '\r\n')"
          fi

          if [[ -z "$version" ]]; then
            echo "[error] Failed to determine version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "[info] Version: $version"

      # ========================================
      # バンドル名のリネーム（統一処理）
      # ========================================

      - name: Rename bundles (Linux/macOS)
        # On tags, include macos-latest (canary matrix) in Release too, so allow rename.
        if: matrix.os != 'windows-latest' && (!matrix.canary || startsWith(github.ref, 'refs/tags/'))
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.version }}"
          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) arch="x86_64" ;;
            aarch64) arch="aarch64" ;;
          esac

          os_suffix=""
          if [[ "${{ matrix.os }}" == macos-* ]]; then
            os_suffix="_${{ matrix.os }}"
          fi

          rename_files() {
            local dir="$1"
            local pattern="$2"
            local ext="$3"
            
            shopt -s nullglob
            local files=( "$dir"/$pattern )
            shopt -u nullglob
            
            if (( ${#files[@]} == 0 )); then
              return 0
            fi
            
            if (( ${#files[@]} == 1 )); then
              local new_name="falkoe_${version}_${arch}${os_suffix}${ext}"
              mv -f "${files[0]}" "${dir}/${new_name}"
              echo "[info] Renamed: ${new_name}"
              return 0
            fi
            
            local i=1
            for f in "${files[@]}"; do
              local new_name="falkoe_${version}_${arch}${os_suffix}_${i}${ext}"
              mv -f "$f" "${dir}/${new_name}"
              echo "[info] Renamed: ${new_name}"
              i=$((i+1))
            done
          }

          base="src-tauri/target/release/bundle"
          rename_files "$base/appimage" "*.AppImage" ".AppImage"
          rename_files "$base/deb" "*.deb" ".deb"
          rename_files "$base/rpm" "*.rpm" ".rpm"
          rename_files "$base/dmg" "*.dmg" ".dmg"

      - name: Rename bundles (Windows)
        if: matrix.os == 'windows-latest' && !matrix.canary
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $version = "${{ steps.version.outputs.version }}"
          $arch = 'x86_64'

          function Rename-Bundles {
            param(
              [string]$Pattern,
              [string]$Extension
            )
            
            $files = @(Get-ChildItem -Path $Pattern -ErrorAction SilentlyContinue)
            if ($files.Count -eq 0) { return }
            
            if ($files.Count -eq 1) {
              $newName = "falkoe_${version}_${arch}${Extension}"
              $dir = $files[0].DirectoryName
              Rename-Item -Path $files[0].FullName -NewName $newName
              Write-Host "[info] Renamed: $newName"
              return
            }
            
            $i = 1
            foreach ($f in $files) {
              $newName = "falkoe_${version}_${arch}_${i}${Extension}"
              $dir = $f.DirectoryName
              Rename-Item -Path $f.FullName -NewName $newName
              Write-Host "[info] Renamed: $newName"
              $i++
            }
          }

          Rename-Bundles -Pattern 'src-tauri/target/release/bundle/msi/*.msi' -Extension '.msi'
          Rename-Bundles -Pattern 'src-tauri/target/release/bundle/nsis/*.exe' -Extension '.exe'

      # ========================================
      # Upload artifacts
      # ========================================

      # upload-artifact occasionally fails with transient network errors.
      # Retry a few times before failing the job.
      - name: Upload artifacts (main branch) (attempt 1)
        id: upload_artifacts_1
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          overwrite: true
          path: |
            src-tauri/target/release/bundle

      - name: Upload artifacts (main branch) (attempt 2)
        id: upload_artifacts_2
        if: github.ref == 'refs/heads/main' && steps.upload_artifacts_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          overwrite: true
          path: |
            src-tauri/target/release/bundle

      - name: Upload artifacts (main branch) (attempt 3)
        id: upload_artifacts_3
        if: github.ref == 'refs/heads/main' && steps.upload_artifacts_2.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          overwrite: true
          path: |
            src-tauri/target/release/bundle

      - name: Fail if artifact upload failed
        if: github.ref == 'refs/heads/main' && !matrix.canary && steps.upload_artifacts_3.outcome == 'failure'
        shell: bash
        run: |
          echo "[error] upload-artifact failed after 3 attempts"
          exit 1

      - name: Prepare GitHub Release body (tags)
        id: release_body
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF#refs/tags/}"
          jp="docs/releases/${tag}.md"
          en="docs/releases/${tag}.en.md"
          out="/tmp/falkoe_release_body.md"

          rm -f "$out"
          {
            if [[ -f "$jp" ]]; then
              cat "$jp"
            else
              echo "# ${tag}"
              echo
              echo "(Release notes file not found: ${jp})"
            fi

            echo
            echo "---"
            echo

            if [[ -f "$en" ]]; then
              cat "$en"
            else
              echo "(English release notes file not found: ${en})"
            fi
          } > "$out"

          echo "body_path=$out" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release (tags)
        # Include macos-latest (canary matrix) in tag releases as a second mac build.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.release_body.outputs.body_path }}
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: false

  # ========================================
  # Android build
  # ========================================

  build_android:
    needs: prepare_mecab_ipadic
    runs-on: ubuntu-latest
    env:
      # Tag of the GitHub Release that hosts pre-built ffmpeg shared libs.
      FFMPEG_ANDROID_RELEASE_TAG: ffmpeg-android-v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download IPADIC dictionary (shared)
        uses: actions/download-artifact@v4
        with:
          name: mecab-ipadic-utf8
          path: src-tauri/resources/mecab/ipadic

      # ── Java ──
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── Android SDK / NDK ──
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.3.13750724"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"

      # ── Rust ──
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── Node / pnpm ──
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # ── Pre-built ffmpeg jniLibs ──
      - name: Download pre-built ffmpeg jniLibs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$FFMPEG_ANDROID_RELEASE_TAG" \
            --pattern 'ffmpeg-android-jniLibs.tar.gz' \
            --dir /tmp

          jni_dir="src-tauri/gen/android/app/src/main/jniLibs"
          mkdir -p "$jni_dir"
          tar xzf /tmp/ffmpeg-android-jniLibs.tar.gz -C "$jni_dir"

          echo "[info] Extracted jniLibs:"
          find "$jni_dir" -name '*.so' -exec ls -lh {} +

      # ── Build ──
      - name: Build Tauri Android APK
        run: pnpm tauri android build

      # ── Version ──
      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=""
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME:-}"
            version="${version#v}"
          fi
          if [[ -z "$version" ]]; then
            version="$(awk '
              $0=="[package]" { in_pkg=1; next }
              /^\[/ { in_pkg=0 }
              in_pkg && $0 ~ /^version[[:space:]]*=/ {
                line=$0; sub(/^[^"]*"/, "", line); sub(/".*$/, "", line)
                print line; exit
              }
            ' src-tauri/Cargo.toml | tr -d '\r\n')"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "[info] Version: $version"

      # ── Rename APK ──
      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          apk_dir="src-tauri/gen/android/app/build/outputs/apk/universal/release"

          shopt -s nullglob
          apks=( "$apk_dir"/*.apk )
          shopt -u nullglob

          if (( ${#apks[@]} == 0 )); then
            echo "[error] No APK found in $apk_dir" >&2
            ls -laR src-tauri/gen/android/app/build/outputs/ || true
            exit 1
          fi

          new_name="falkoe_${version}_android_universal.apk"
          mv -f "${apks[0]}" "${apk_dir}/${new_name}"
          echo "[info] Renamed APK: ${new_name}"
          echo "apk_path=${apk_dir}/${new_name}" >> "$GITHUB_ENV"

      # ── Upload artifact (main branch) ──
      - name: Upload Android artifact (main branch)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: falkoe-android
          overwrite: true
          path: ${{ env.apk_path }}

      # ── Upload to GitHub Release (tags) ──
      - name: Upload Android APK to GitHub Release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.apk_path }}
          fail_on_unmatched_files: false
