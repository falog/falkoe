name: Build and Release Falkoe

on:
  push:
    branches: [main]
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare_mecab_ipadic:
    runs-on: ubuntu-latest
    steps:
      - name: Install MeCab + IPADIC (UTF-8)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt install -y mecab mecab-ipadic-utf8

      - name: Collect IPADIC dictionary files
        shell: bash
        run: |
          set -euo pipefail

          out_dir="/tmp/mecab_ipadic_artifact"
          rm -rf "$out_dir"
          mkdir -p "$out_dir"

          dic_dir=""
          for candidate in \
            /var/lib/mecab/dic/ipadic-utf8 \
            /usr/share/mecab/dic/ipadic-utf8 \
            /var/lib/mecab/dic/ipadic \
            /usr/share/mecab/dic/ipadic
          do
            if [[ -d "$candidate" && -f "$candidate/dicrc" ]]; then
              dic_dir="$candidate"
              break
            fi
          done

          if [[ -z "$dic_dir" ]]; then
            echo "[error] ipadic dicdir not found" >&2
            exit 1
          fi

          cp -RL "$dic_dir"/* "$out_dir/"

          for file in dicrc sys.dic unk.dic; do
            if [[ ! -f "$out_dir/$file" ]]; then
              echo "[error] missing required dic file: $file" >&2
              exit 1
            fi
          done

          echo "[info] collected ipadic from: $dic_dir"
          ls -lh "$out_dir" | head -n 30

      - name: Upload IPADIC dictionary artifact
        uses: actions/upload-artifact@v4
        with:
          name: mecab-ipadic-utf8
          path: /tmp/mecab_ipadic_artifact

  build:
    needs: prepare_mecab_ipadic
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.canary || false }}
    env:
      ARTIFACT_NAME: ${{ matrix.artifact_name }}
      FALKOE_BUNDLE_TRANSCRIBE_HELPERS: ${{ matrix.bundle_transcribe_helpers || '' }}
      FALKOE_BUILD_VULKAN_HELPER: ${{ matrix.build_vulkan_helper || '' }}
      FALKOE_REQUIRE_VULKAN_HELPER: ${{ matrix.require_vulkan_helper || '' }}
      FALKOE_BUILD_METAL_HELPER: ${{ matrix.build_metal_helper || '' }}
      FALKOE_REQUIRE_METAL_HELPER: ${{ matrix.require_metal_helper || '' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Default CPU builds
          - os: ubuntu-latest
            variant: default
            canary: false
            artifact_name: falkoe-ubuntu-latest
            needs_vulkan_deps: "1"
            bundle_transcribe_helpers: "1"
            build_vulkan_helper: "1"
            require_vulkan_helper: "1"
          - os: windows-latest
            variant: default
            canary: false
            artifact_name: falkoe-windows-latest
          - os: macos-14
            variant: default
            canary: false
            artifact_name: falkoe-macos-14
            bundle_transcribe_helpers: "1"
            build_metal_helper: "1"
            require_metal_helper: "1"

          # Canary builds (macos-latest)
          - os: macos-latest
            variant: default
            canary: true
            artifact_name: falkoe-macos-latest-canary
            bundle_transcribe_helpers: "1"
            build_metal_helper: "1"
            require_metal_helper: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download IPADIC dictionary (shared)
        if: matrix.os == 'windows-latest'
        uses: actions/download-artifact@v4
        with:
          name: mecab-ipadic-utf8
          path: src-tauri/resources/mecab/ipadic

      # ========================================
      # 依存関係インストール
      # ========================================

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libasound2-dev \
            build-essential \
            ffmpeg \
            mecab \
            mecab-ipadic-utf8

          if [[ "${{ matrix.needs_vulkan_deps || '' }}" == "1" ]]; then
            sudo apt install -y cmake libvulkan-dev
            sudo apt install -y glslc || sudo apt install -y shaderc || sudo apt install -y shaderc-tools
            command -v glslc
          fi

      - name: Install tools (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: choco install -y ffmpeg

      - name: Install Vulkan SDK (Windows)
        if: matrix.os == 'windows-latest' && matrix.variant == 'default'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          winget --version
          winget install --id KhronosGroup.VulkanSDK -e --silent --accept-package-agreements --accept-source-agreements

          $sdk = Get-ChildItem -Path 'C:\VulkanSDK' -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $sdk) {
            throw "Vulkan SDK install succeeded but C:\\VulkanSDK was not found"
          }

          "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PATH=$($sdk.FullName)\\Bin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          & "$($sdk.FullName)\\Bin\\glslc.exe" --version

      - name: Setup MSYS2 (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-mecab
            mingw-w64-x86_64-gettext

      - name: Verify MeCab installation (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          pacman -S --noconfirm --needed mingw-w64-x86_64-mecab mingw-w64-x86_64-gettext
          echo "[info] mecab packages:" 
          pacman -Q | grep -i mecab || true
          echo "[info] mecab location:" 
          command -v mecab || true

      - name: Install tools (macOS)
        if: startsWith(matrix.os, 'macos-')
        run: |
          brew update
          brew install ffmpeg mecab mecab-ipadic

      # ========================================
      # バンドル処理: ffmpeg
      # ========================================

      - name: Bundle ffmpeg (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/bin

          asset="ffmpeg-n8.0-latest-linux64-gpl-8.0.tar.xz"
          url="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/${asset}"
          tmpdir="$(mktemp -d)"

          curl -fsSL -o "$tmpdir/ffmpeg.tar.xz" "$url"
          tar -C "$tmpdir" -xf "$tmpdir/ffmpeg.tar.xz"

          ffdir="$(find "$tmpdir" -maxdepth 1 -type d -name 'ffmpeg-*' | head -n 1)"
          if [[ -z "$ffdir" || ! -f "$ffdir/bin/ffmpeg" ]]; then
            echo "[error] ffmpeg download/extract failed"
            exit 1
          fi

          cp -f "$ffdir/bin/ffmpeg" src-tauri/resources/bin/ffmpeg
          chmod +x src-tauri/resources/bin/ffmpeg
          echo "[info] bundled: $(src-tauri/resources/bin/ffmpeg -version | head -n1)"

          conf="$(src-tauri/resources/bin/ffmpeg -buildconf 2>/dev/null || true)"
          if ! grep -q -- '--enable-gpl' <<<"$conf"; then
            echo "[error] bundled ffmpeg is not a GPL build"
            exit 1
          fi
          if grep -q -- '--enable-nonfree' <<<"$conf"; then
            echo "[error] bundled ffmpeg is nonfree; abort"
            exit 1
          fi

      - name: Bundle ffmpeg (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'src-tauri/resources/bin' | Out-Null

          $asset = 'ffmpeg-n8.0-latest-win64-gpl-shared-8.0.zip'
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$asset"
          $tmp = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          $zip = Join-Path $tmp $asset
          $out = Join-Path $tmp 'out'

          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          if (Test-Path $out) { Remove-Item -Recurse -Force $out }
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $out -Force

          $ffmpegExe = Get-ChildItem -Path $out -Recurse -File -Filter 'ffmpeg.exe' | Select-Object -First 1
          if (-not $ffmpegExe) { throw 'ffmpeg.exe not found' }
          $ffmpegDir = $ffmpegExe.Directory.FullName

          $ver = (& $ffmpegExe.FullName -version 2>&1 | Out-String)
          if ($ver -notmatch '--enable-gpl') { throw 'Bundled ffmpeg is not a GPL build' }
          if ($ver -match '--enable-nonfree') { throw 'Bundled ffmpeg is nonfree; abort' }

          Copy-Item -Force $ffmpegExe.FullName 'src-tauri/resources/bin/ffmpeg.exe'
          Get-ChildItem -Path $ffmpegDir -Filter '*.dll' -File -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item -Force $_.FullName 'src-tauri/resources/bin/' }

          Write-Host "[info] bundled ffmpeg.exe (GPL build)"

      - name: Bundle ffmpeg (macOS)
        if: startsWith(matrix.os, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/bin

          curl -fsSL -o /tmp/ffmpeg.zip "https://evermeet.cx/ffmpeg/getrelease/zip"
          unzip -q -o /tmp/ffmpeg.zip -d /tmp/ffmpeg

          if [[ ! -f /tmp/ffmpeg/ffmpeg ]]; then
            echo "[error] ffmpeg unzip failed"
            exit 1
          fi

          cp -f /tmp/ffmpeg/ffmpeg src-tauri/resources/bin/ffmpeg
          chmod +x src-tauri/resources/bin/ffmpeg
          echo "[info] bundled: $(src-tauri/resources/bin/ffmpeg -version | head -n1)"

          conf="$(src-tauri/resources/bin/ffmpeg -buildconf 2>/dev/null || true)"
          if ! grep -q -- '--enable-gpl' <<<"$conf"; then
            echo "[error] bundled ffmpeg is not a GPL build"
            exit 1
          fi
          if grep -q -- '--enable-nonfree' <<<"$conf"; then
            echo "[error] bundled ffmpeg is nonfree; abort"
            exit 1
          fi

      # ========================================
      # バンドル処理: WORLD helper
      # ========================================

      - name: Build + bundle WORLD helper (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/bin
          pushd src-tauri >/dev/null
          cargo build --release --bin world_pitch
          popd >/dev/null
          cp -f src-tauri/target/release/world_pitch src-tauri/resources/bin/world_pitch
          chmod +x src-tauri/resources/bin/world_pitch
          echo "[info] bundled WORLD helper: world_pitch"

      - name: Build + bundle WORLD helper (macOS)
        if: startsWith(matrix.os, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/bin
          pushd src-tauri >/dev/null
          cargo build --release --bin world_pitch
          popd >/dev/null
          cp -f src-tauri/target/release/world_pitch src-tauri/resources/bin/world_pitch
          chmod +x src-tauri/resources/bin/world_pitch
          echo "[info] bundled WORLD helper: world_pitch"

      - name: Build + bundle WORLD helper (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'src-tauri/resources/bin' | Out-Null
          pushd src-tauri
          cargo build --release --bin world_pitch
          popd
          Copy-Item -Force 'src-tauri/target/release/world_pitch.exe' 'src-tauri/resources/bin/world_pitch.exe'
          Write-Host "[info] bundled WORLD helper: world_pitch.exe"

      # ========================================
      # バンドル処理: Praat
      # ========================================

      - name: Bundle Praat (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/bin

          asset="praat6452_linux-intel64-barren.tar.gz"
          url="https://www.fon.hum.uva.nl/praat/${asset}"
          tmpdir="$(mktemp -d)"

          curl -fsSL -o "$tmpdir/praat.tar.gz" "$url"
          tar -C "$tmpdir" -xzf "$tmpdir/praat.tar.gz"

          praat_bin=""
          if [[ -f "$tmpdir/praat" ]]; then
            praat_bin="$tmpdir/praat"
          elif [[ -f "$tmpdir/praat_barren" ]]; then
            praat_bin="$tmpdir/praat_barren"
          fi

          if [[ -z "$praat_bin" ]]; then
            echo "[error] praat binary not found after extract"
            ls -la "$tmpdir" || true
            exit 1
          fi

          cp -f "$praat_bin" src-tauri/resources/bin/praat
          chmod +x src-tauri/resources/bin/praat
          echo "[info] bundled praat (barren)"

      - name: Bundle Praat (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'src-tauri/resources/bin' | Out-Null

          $asset = 'praat6452_win-intel64.zip'
          $url = "https://www.fon.hum.uva.nl/praat/$asset"
          $tmp = Join-Path $env:RUNNER_TEMP 'praat'
          $zip = Join-Path $tmp $asset
          $out = Join-Path $tmp 'out'

          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          if (Test-Path $out) { Remove-Item -Recurse -Force $out }
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $out -Force

          $praatExe = Get-ChildItem -Path $out -Recurse -File -Filter 'Praat.exe' | Select-Object -First 1
          if (-not $praatExe) {
            $praatExe = Get-ChildItem -Path $out -Recurse -File -Filter 'praat.exe' | Select-Object -First 1
          }
          if (-not $praatExe) { throw 'Praat.exe not found' }

          Copy-Item -Force $praatExe.FullName 'src-tauri/resources/bin/praat.exe'
          Write-Host "[info] bundled praat.exe"

      - name: Bundle Praat (macOS)
        if: startsWith(matrix.os, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/bin

          asset="praat6452_mac.dmg"
          url="https://www.fon.hum.uva.nl/praat/${asset}"
          tmpdir="$(mktemp -d)"

          curl -fsSL -o "$tmpdir/praat.dmg" "$url"
          mnt="$tmpdir/mnt"
          mkdir -p "$mnt"

          hdiutil attach "$tmpdir/praat.dmg" -mountpoint "$mnt" -nobrowse -quiet
          if [[ -d "$mnt/Praat.app" && -f "$mnt/Praat.app/Contents/MacOS/Praat" ]]; then
            rm -rf src-tauri/resources/bin/Praat.app
            cp -R "$mnt/Praat.app" src-tauri/resources/bin/Praat.app
          elif [[ -f "$mnt/Praat" ]]; then
            cp -f "$mnt/Praat" src-tauri/resources/bin/praat.bin
          else
            ls -la "$mnt" || true
            hdiutil detach "$mnt" -quiet || true
            echo "[error] Praat app/binary not found in DMG"
            exit 1
          fi
          hdiutil detach "$mnt" -quiet

          if [[ -d src-tauri/resources/bin/Praat.app ]]; then
            chmod -R a+rX src-tauri/resources/bin/Praat.app || true
          fi
          if [[ -f src-tauri/resources/bin/praat.bin ]]; then
            chmod a+rX src-tauri/resources/bin/praat.bin || true
          fi

          cat > src-tauri/resources/bin/praat <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          here="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

          if [[ -x "$here/Praat.app/Contents/MacOS/Praat" ]]; then
            exec "$here/Praat.app/Contents/MacOS/Praat" "$@"
          elif [[ -x "$here/praat.bin" ]]; then
            exec "$here/praat.bin" "$@"
          else
            echo "[error] Praat not bundled correctly" >&2
            exit 1
          fi
          SH

          chmod +x src-tauri/resources/bin/praat
          if [[ -f src-tauri/resources/bin/praat.bin ]]; then
            chmod +x src-tauri/resources/bin/praat.bin
          fi

          if command -v xattr >/dev/null 2>&1; then
            xattr -dr com.apple.quarantine src-tauri/resources/bin/Praat.app 2>/dev/null || true
            xattr -d com.apple.quarantine src-tauri/resources/bin/praat.bin 2>/dev/null || true
            xattr -d com.apple.quarantine src-tauri/resources/bin/praat 2>/dev/null || true
          fi

          echo "[info] bundled praat"

      # ========================================
      # バンドル処理: MeCab
      # ========================================

      - name: Bundle MeCab (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/bin
          mkdir -p src-tauri/resources/mecab/ipadic

          if ! command -v mecab >/dev/null 2>&1; then
            echo "[error] mecab not found"
            exit 1
          fi

          cp -f "$(command -v mecab)" src-tauri/resources/bin/mecab
          chmod +x src-tauri/resources/bin/mecab
          echo "[info] bundled mecab binary"

          dic_dir=""
          for candidate in \
            /var/lib/mecab/dic/ipadic-utf8 \
            /usr/share/mecab/dic/ipadic-utf8 \
            /var/lib/mecab/dic/ipadic \
            /usr/share/mecab/dic/ipadic
          do
            if [[ -d "$candidate" && -f "$candidate/dicrc" ]]; then
              dic_dir="$candidate"
              break
            fi
          done

          if [[ -z "$dic_dir" ]]; then
            echo "[error] ipadic not found"
            exit 1
          fi

          cp -RL "$dic_dir"/* src-tauri/resources/mecab/ipadic/

          for file in dicrc sys.dic unk.dic; do
            if [[ ! -f "src-tauri/resources/mecab/ipadic/$file" ]]; then
              echo "[error] failed to copy $file"
              exit 1
            fi
          done

          echo "[info] bundled ipadic from $dic_dir"

      - name: Bundle MeCab (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/bin
          mkdir -p src-tauri/resources/mecab/ipadic

          if [[ ! -f src-tauri/resources/mecab/ipadic/dicrc ]]; then
            echo "[error] bundled ipadic dictionary is missing (dicrc not found)." >&2
            echo "[info] expected at: src-tauri/resources/mecab/ipadic" >&2
            ls -la src-tauri/resources/mecab/ipadic || true
            exit 1
          fi

          pacman -S --noconfirm --needed mingw-w64-x86_64-mecab mingw-w64-x86_64-gettext

          if ! command -v mecab >/dev/null 2>&1; then
            echo "[error] mecab not found on PATH"
            exit 1
          fi

          mecab_path="$(command -v mecab)"
          echo "[info] mecab path: $mecab_path"
          cp -f "$mecab_path" src-tauri/resources/bin/mecab.exe

          mecab_dir="$(dirname "$mecab_path")"
          echo "[info] copying DLLs from $mecab_dir"

          cp -f "$mecab_dir"/libmecab*.dll src-tauri/resources/bin/ 2>/dev/null || true
          cp -f "$mecab_dir"/libiconv-2.dll src-tauri/resources/bin/ 2>/dev/null || true
          cp -f "$mecab_dir"/libintl-8.dll src-tauri/resources/bin/ 2>/dev/null || true
          cp -f "$mecab_dir"/libcharset-1.dll src-tauri/resources/bin/ 2>/dev/null || true
          cp -f "$mecab_dir"/libgcc_s_seh*.dll src-tauri/resources/bin/ 2>/dev/null || true
          cp -f "$mecab_dir"/libstdc++*.dll src-tauri/resources/bin/ 2>/dev/null || true
          cp -f "$mecab_dir"/libwinpthread*.dll src-tauri/resources/bin/ 2>/dev/null || true

          for dll in libmecab-2.dll libiconv-2.dll libintl-8.dll libcharset-1.dll; do
            if [[ ! -f "src-tauri/resources/bin/$dll" ]]; then
              echo "[error] missing required MeCab DLL in bundle: $dll"
              exit 1
            fi
          done

          echo "[info] bundled mecab.exe and DLLs"
          echo "[info] bundled ipadic dictionary (shared artifact)"

      - name: Bundle MeCab (macOS)
        if: startsWith(matrix.os, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/bin
          mkdir -p src-tauri/resources/mecab/ipadic

          if ! command -v mecab >/dev/null 2>&1; then
            echo "[error] mecab not found"
            exit 1
          fi

          cp -f "$(command -v mecab)" src-tauri/resources/bin/mecab
          chmod +x src-tauri/resources/bin/mecab
          echo "[info] bundled mecab binary"

          if ! command -v mecab-config >/dev/null 2>&1; then
            echo "[error] mecab-config not found"
            exit 1
          fi

          dic_dir="$(mecab-config --dicdir)/ipadic"
          echo "[info] looking for ipadic at: $dic_dir"

          if [[ ! -d "$dic_dir" ]]; then
            echo "[error] ipadic directory not found at $dic_dir"
            ls -la "$(mecab-config --dicdir)" || true
            exit 1
          fi

          echo "[info] ipadic contents:"
          ls -la "$dic_dir" || true

          for file in dicrc sys.dic unk.dic; do
            if [[ ! -f "$dic_dir/$file" ]]; then
              echo "[error] required file not found: $dic_dir/$file"
              exit 1
            fi
          done

          rm -rf src-tauri/resources/mecab/ipadic/*
          cp -RL "$dic_dir"/* src-tauri/resources/mecab/ipadic/

          echo "[info] bundled files:"
          ls -la src-tauri/resources/mecab/ipadic/ || true

          for file in dicrc sys.dic unk.dic; do
            if [[ ! -f "src-tauri/resources/mecab/ipadic/$file" ]]; then
              echo "[error] failed to copy $file"
              exit 1
            fi
          done

          echo "[info] bundled ipadic from $dic_dir"

      # ========================================
      # Node / pnpm setup
      # ========================================

      - name: Verify bundled tools (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          echo "[info] bundled tools directory listing:"
          ls -la src-tauri/resources/bin || true
          echo "[info] bundled praat scripts directory listing:"
          ls -la src-tauri/resources/praat || true

          test -e src-tauri/resources/bin/ffmpeg
          test -e src-tauri/resources/bin/praat

          if [[ "${RUNNER_OS:-}" == "macOS" ]]; then
            test -x src-tauri/resources/bin/Praat.app/Contents/MacOS/Praat || test -x src-tauri/resources/bin/praat.bin
          fi

          test -e src-tauri/resources/bin/mecab
          test -e src-tauri/resources/mecab/ipadic/dicrc
          test -e src-tauri/resources/mecab/ipadic/sys.dic
          test -e src-tauri/resources/mecab/ipadic/unk.dic

          echo "[info] checksums (sha256):"
          (command -v sha256sum >/dev/null 2>&1 && sha256sum src-tauri/resources/bin/ffmpeg src-tauri/resources/bin/praat src-tauri/resources/bin/mecab) || true

      - name: Smoke test Praat (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          wav="$tmpdir/test.wav"
          out="$tmpdir/out.tsv"
          script="src-tauri/resources/praat/extract_pitch_to_tsv.praat"

          echo "[info] generating test wav with bundled ffmpeg"
          src-tauri/resources/bin/ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "sine=frequency=440:duration=1" -ac 1 -ar 16000 "$wav"

          echo "[info] running bundled praat --run"
          python3 - "$wav" "$out" <<'PY'
          import subprocess
          import sys

          cmd = [
              'src-tauri/resources/bin/praat',
              '--run',
              'src-tauri/resources/praat/extract_pitch_to_tsv.praat',
              sys.argv[1],
              sys.argv[2],
              '0.01',
              '75',
              '500',
          ]

          try:
              subprocess.run(cmd, check=True, timeout=15)
          except subprocess.TimeoutExpired:
              print('[error] Praat smoke test timed out', file=sys.stderr)
              raise
          PY

          if [[ ! -s "$out" ]]; then
            echo "[error] praat smoke test failed: output tsv missing/empty"
            exit 1
          fi
          echo "[info] praat smoke test ok: $(wc -l < "$out") lines"

      - name: Verify bundled tools (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "[info] bundled tools directory listing:"
          Get-ChildItem -Path 'src-tauri/resources/bin' -File | Sort-Object Name | Format-Table Name,Length

          if (!(Test-Path 'src-tauri/resources/bin/ffmpeg.exe')) { throw 'missing bundled ffmpeg.exe' }
          if (!(Test-Path 'src-tauri/resources/bin/praat.exe')) { throw 'missing bundled praat.exe' }
          if (!(Test-Path 'src-tauri/resources/bin/mecab.exe')) { throw 'missing bundled mecab.exe' }

          foreach ($dll in @('libmecab-2.dll','libiconv-2.dll','libintl-8.dll','libcharset-1.dll')) {
            if (!(Test-Path (Join-Path 'src-tauri/resources/bin' $dll))) { throw "missing bundled MeCab DLL: $dll" }
          }
          foreach ($f in @('dicrc','sys.dic','unk.dic')) {
            if (!(Test-Path (Join-Path 'src-tauri/resources/mecab/ipadic' $f))) { throw "missing bundled MeCab dictionary file: $f" }
          }

      - name: Smoke test Praat (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tmp = Join-Path $env:RUNNER_TEMP 'praat-smoke'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $wav = Join-Path $tmp 'test.wav'
          $out = Join-Path $tmp 'out.tsv'
          $ffmpeg = Resolve-Path 'src-tauri/resources/bin/ffmpeg.exe'
          $praat = Resolve-Path 'src-tauri/resources/bin/praat.exe'
          $script = Resolve-Path 'src-tauri/resources/praat/extract_pitch_to_tsv.praat'

          Write-Host "[info] generating test wav"
          & $ffmpeg -hide_banner -loglevel error -y -f lavfi -i "sine=frequency=440:duration=1" -ac 1 -ar 16000 $wav

          Write-Host "[info] running bundled praat"
          $p = Start-Process -FilePath $praat -ArgumentList @('--run', $script, $wav, $out, '0.01', '75', '500') -PassThru
          $ok = $p.WaitForExit(15000)
          if (-not $ok) {
            try { $p.Kill() } catch {}
            throw 'Praat smoke test timed out'
          }
          if ($p.ExitCode -ne 0) { throw "Praat failed with exit code $($p.ExitCode)" }
          if (!(Test-Path $out) -or (Get-Item $out).Length -le 0) { throw 'Praat output missing/empty' }
          Write-Host "[info] praat smoke test ok"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # ========================================
      # Rust setup
      # ========================================

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Preflight permissions (macOS)
        if: startsWith(matrix.os, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d src-tauri/resources ]]; then
            echo "[error] src-tauri/resources not found"
            exit 1
          fi

          echo "[info] quick resource permission diagnostics"
          ls -la src-tauri/resources || true
          ls -la src-tauri/resources/bin || true
          if [[ -d src-tauri/resources/bin/Praat.app ]]; then
            ls -la src-tauri/resources/bin/Praat.app/Contents/MacOS || true
          fi
          find src-tauri/resources/bin -maxdepth 6 -type l -print 2>/dev/null || true

          echo "[info] normalizing permissions"
          chmod -R u+rwX,go+rX src-tauri/resources || true

      # ========================================
      # Build
      # ========================================

      - name: Build Tauri app (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm tauri build

      - name: Build Tauri app (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        env:
          CARGO_TARGET_DIR: D:\t
          FALKOE_BUILD_VULKAN_HELPER: "1"
          FALKOE_REQUIRE_VULKAN_HELPER: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force 'D:\t' | Out-Null

          pnpm tauri build

          $src = 'D:\t\release\bundle'
          $dst = 'src-tauri\target\release\bundle'
          if (-not (Test-Path $src)) { throw "Expected bundle directory not found: $src" }
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item -Recurse -Force "$src\*" $dst

      - name: Build Tauri app (macOS)
        if: startsWith(matrix.os, 'macos-')
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          CMAKE_OSX_DEPLOYMENT_TARGET: "11.0"
          CMAKE_ARGS: "-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
          GGML_NO_OPENMP: "1"
          WHISPER_NO_OPENMP: "1"
          RUST_BACKTRACE: "1"
        run: pnpm tauri build -- --features no-openmp

      # ========================================
      # バージョン取得（統一ロジック）
      # ========================================

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version=""
          # タグビルドの場合は、タグから優先的にバージョンを取得
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME:-}"
            version="${version#v}"
          fi

          # タグがない場合はCargo.tomlから取得
          if [[ -z "$version" ]]; then
            # Prefer Rust crate version for non-tag builds.
            # (Avoid relying on node being available, and keep versioning consistent with src-tauri.)
            version="$(awk '
              $0=="[package]" { in_pkg=1; next }
              /^\[/ { in_pkg=0 }
              in_pkg && $0 ~ /^version[[:space:]]*=/ {
                line=$0
                sub(/^[^"]*"/, "", line)
                sub(/".*$/, "", line)
                print line
                exit
              }
            ' src-tauri/Cargo.toml | head -n 1)"
            # Normalize potential CRLF/newline.
            version="$(printf '%s' "$version" | tr -d '\r\n')"
          fi

          if [[ -z "$version" ]]; then
            echo "[error] Failed to determine version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "[info] Version: $version"

      # ========================================
      # バンドル名のリネーム（統一処理）
      # ========================================

      - name: Rename bundles (Linux/macOS)
        if: matrix.os != 'windows-latest' && !matrix.canary
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.version }}"
          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) arch="x86_64" ;;
            aarch64) arch="aarch64" ;;
          esac

          rename_files() {
            local dir="$1"
            local pattern="$2"
            local ext="$3"
            
            shopt -s nullglob
            local files=( "$dir"/$pattern )
            shopt -u nullglob
            
            if (( ${#files[@]} == 0 )); then
              return 0
            fi
            
            if (( ${#files[@]} == 1 )); then
              local new_name="Falkoe_${version}_${arch}${ext}"
              mv -f "${files[0]}" "${dir}/${new_name}"
              echo "[info] Renamed: ${new_name}"
              return 0
            fi
            
            local i=1
            for f in "${files[@]}"; do
              local new_name="Falkoe_${version}_${arch}_${i}${ext}"
              mv -f "$f" "${dir}/${new_name}"
              echo "[info] Renamed: ${new_name}"
              i=$((i+1))
            done
          }

          base="src-tauri/target/release/bundle"
          rename_files "$base/appimage" "*.AppImage" ".AppImage"
          rename_files "$base/deb" "*.deb" ".deb"
          rename_files "$base/rpm" "*.rpm" ".rpm"
          rename_files "$base/dmg" "*.dmg" ".dmg"

      - name: Rename bundles (Windows)
        if: matrix.os == 'windows-latest' && !matrix.canary
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $version = "${{ steps.version.outputs.version }}"
          $arch = 'x86_64'

          function Rename-Bundles {
            param(
              [string]$Pattern,
              [string]$Extension
            )
            
            $files = @(Get-ChildItem -Path $Pattern -ErrorAction SilentlyContinue)
            if ($files.Count -eq 0) { return }
            
            if ($files.Count -eq 1) {
              $newName = "Falkoe_${version}_${arch}${Extension}"
              $dir = $files[0].DirectoryName
              Rename-Item -Path $files[0].FullName -NewName $newName
              Write-Host "[info] Renamed: $newName"
              return
            }
            
            $i = 1
            foreach ($f in $files) {
              $newName = "Falkoe_${version}_${arch}_${i}${Extension}"
              $dir = $f.DirectoryName
              Rename-Item -Path $f.FullName -NewName $newName
              Write-Host "[info] Renamed: $newName"
              $i++
            }
          }

          Rename-Bundles -Pattern 'src-tauri/target/release/bundle/msi/*.msi' -Extension '.msi'
          Rename-Bundles -Pattern 'src-tauri/target/release/bundle/nsis/*.exe' -Extension '.exe'

      # ========================================
      # Upload artifacts
      # ========================================

      # upload-artifact occasionally fails with transient network errors.
      # Retry a few times before failing the job.
      - name: Upload artifacts (main branch) (attempt 1)
        id: upload_artifacts_1
        if: github.ref == 'refs/heads/main' && !matrix.canary
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          overwrite: true
          path: |
            src-tauri/target/release/bundle

      - name: Upload artifacts (main branch) (attempt 2)
        id: upload_artifacts_2
        if: github.ref == 'refs/heads/main' && !matrix.canary && steps.upload_artifacts_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          overwrite: true
          path: |
            src-tauri/target/release/bundle

      - name: Upload artifacts (main branch) (attempt 3)
        id: upload_artifacts_3
        if: github.ref == 'refs/heads/main' && !matrix.canary && steps.upload_artifacts_2.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          overwrite: true
          path: |
            src-tauri/target/release/bundle

      - name: Fail if artifact upload failed
        if: github.ref == 'refs/heads/main' && !matrix.canary && steps.upload_artifacts_3.outcome == 'failure'
        shell: bash
        run: |
          echo "[error] upload-artifact failed after 3 attempts"
          exit 1

      - name: Upload to GitHub Release (tags)
        if: startsWith(github.ref, 'refs/tags/') && !matrix.canary
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: false
