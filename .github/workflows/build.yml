name: Build and Release Falkoe

on:
  push:
    branches: [main]
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ========================================
      # 依存関係インストール
      # ========================================

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libasound2-dev \
            build-essential \
            ffmpeg \
            praat \
            mecab \
            mecab-ipadic-utf8

      - name: Install tools (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          choco install -y ffmpeg praat

      - name: Setup MSYS2 (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-mecab
            mingw-w64-x86_64-mecab-naist-jdic

      - name: Verify MeCab installation (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          pacman -S --noconfirm --needed mingw-w64-x86_64-mecab mingw-w64-x86_64-mecab-naist-jdic
          echo "[info] mecab packages:" 
          pacman -Q | grep -i mecab || true
          echo "[info] mecab location:" 
          command -v mecab || true

      - name: Install tools (macOS)
        if: matrix.os == 'macos-14'
        run: |
          brew update
          brew install ffmpeg
          brew install mecab mecab-ipadic
          brew install --cask praat

      # ========================================
      # バンドル処理: ffmpeg
      # ========================================

      - name: Bundle ffmpeg (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/bin

          curl -fsSL -o /tmp/ffmpeg.tar.xz \
            "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"
          tar -C /tmp -xf /tmp/ffmpeg.tar.xz

          ffdir="$(find /tmp -maxdepth 1 -type d -name 'ffmpeg-*-amd64-static' | head -n 1)"
          if [[ -z "$ffdir" || ! -f "$ffdir/ffmpeg" ]]; then
            echo "[error] static ffmpeg download/extract failed"
            exit 1
          fi

          cp -f "$ffdir/ffmpeg" src-tauri/resources/bin/ffmpeg
          chmod +x src-tauri/resources/bin/ffmpeg
          echo "[info] bundled: $(src-tauri/resources/bin/ffmpeg -version | head -n1)"

      - name: Bundle ffmpeg (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'src-tauri/resources/bin' | Out-Null

          $choco = $env:ChocolateyInstall
          if (-not $choco) { throw 'ChocolateyInstall not set' }

          function Find-FirstFile([string]$root, [string]$pattern) {
            Get-ChildItem -Path $root -Recurse -File -Filter $pattern -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          # ffmpeg
          $ffmpegDir = Join-Path $choco 'lib\ffmpeg\tools\ffmpeg\bin'
          if (-not (Test-Path $ffmpegDir)) {
            $ffmpegExe = Find-FirstFile (Join-Path $choco 'lib') 'ffmpeg.exe'
            if (-not $ffmpegExe) { throw 'ffmpeg.exe not found' }
            $ffmpegDir = $ffmpegExe.Directory.FullName
          }

          $ffmpegExePath = Join-Path $ffmpegDir 'ffmpeg.exe'
          if (-not (Test-Path $ffmpegExePath)) {
            throw "ffmpeg.exe not found at $ffmpegExePath"
          }

          Copy-Item -Force $ffmpegExePath 'src-tauri/resources/bin/ffmpeg.exe'

          # Copy DLLs if present
          Get-ChildItem -Path $ffmpegDir -Filter '*.dll' -File -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item -Force $_.FullName 'src-tauri/resources/bin/' }

          Write-Host "[info] bundled ffmpeg.exe"

      - name: Bundle ffmpeg (macOS)
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/bin

          curl -fsSL -o /tmp/ffmpeg.zip "https://evermeet.cx/ffmpeg/getrelease/zip"
          unzip -q -o /tmp/ffmpeg.zip -d /tmp/ffmpeg

          if [[ ! -f /tmp/ffmpeg/ffmpeg ]]; then
            echo "[error] ffmpeg unzip failed"
            exit 1
          fi

          cp -f /tmp/ffmpeg/ffmpeg src-tauri/resources/bin/ffmpeg
          chmod +x src-tauri/resources/bin/ffmpeg
          echo "[info] bundled: $(src-tauri/resources/bin/ffmpeg -version | head -n1)"

      # ========================================
      # バンドル処理: Praat
      # ========================================

      - name: Bundle Praat (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/bin

          if command -v praat >/dev/null 2>&1; then
            cp -f "$(command -v praat)" src-tauri/resources/bin/praat
            chmod +x src-tauri/resources/bin/praat
            echo "[info] bundled praat"
          else
            echo "[warn] praat not found; pitch will fallback to YIN"
          fi

      - name: Bundle Praat (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'src-tauri/resources/bin' | Out-Null

          $choco = $env:ChocolateyInstall
          if (-not $choco) { throw 'ChocolateyInstall not set' }

          function Find-FirstFile([string]$root, [string]$pattern) {
            Get-ChildItem -Path $root -Recurse -File -Filter $pattern -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          $praatRoot = Join-Path $choco 'lib'
          $praatExe = Find-FirstFile $praatRoot 'praat.exe'
          if ($praatExe) {
            Copy-Item -Force $praatExe.FullName 'src-tauri/resources/bin/praat.exe'
            Write-Host "[info] bundled praat.exe"
          } else {
            Write-Host '[warn] praat.exe not found; pitch will fallback to YIN'
          }

          $praatCon = Find-FirstFile $praatRoot 'praatcon.exe'
          if ($praatCon) {
            Copy-Item -Force $praatCon.FullName 'src-tauri/resources/bin/praatcon.exe'
            Write-Host "[info] bundled praatcon.exe"
          }

      - name: Bundle Praat (macOS)
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/bin

          praat_app="/Applications/Praat.app"
          praat_bin="$praat_app/Contents/MacOS/Praat"

          if [[ -f "$praat_bin" ]]; then
            cp -f "$praat_bin" src-tauri/resources/bin/praat
            chmod +x src-tauri/resources/bin/praat
            echo "[info] bundled praat from .app"
          elif command -v praat >/dev/null 2>&1; then
            cp -f "$(command -v praat)" src-tauri/resources/bin/praat
            chmod +x src-tauri/resources/bin/praat
            echo "[info] bundled praat from PATH"
          else
            echo "[warn] praat not found; pitch will fallback to YIN"
          fi

      # ========================================
      # バンドル処理: MeCab
      # ========================================

      - name: Bundle MeCab (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/bin
          mkdir -p src-tauri/resources/mecab/ipadic

          # mecab実行ファイル
          if ! command -v mecab >/dev/null 2>&1; then
            echo "[error] mecab not found"
            exit 1
          fi

          cp -f "$(command -v mecab)" src-tauri/resources/bin/mecab
          chmod +x src-tauri/resources/bin/mecab
          echo "[info] bundled mecab binary"

          # 辞書ファイル
          dic_dir=""
          for candidate in /var/lib/mecab/dic/ipadic /usr/share/mecab/dic/ipadic; do
            if [[ -d "$candidate" && -f "$candidate/dicrc" ]]; then
              dic_dir="$candidate"
              break
            fi
          done

          if [[ -z "$dic_dir" ]]; then
            echo "[error] ipadic not found"
            exit 1
          fi

          # シンボリックリンクを解決して実ファイルをコピー
          cp -RL "$dic_dir"/* src-tauri/resources/mecab/ipadic/

          # 必須ファイルの確認
          for file in dicrc sys.dic unk.dic; do
            if [[ ! -f "src-tauri/resources/mecab/ipadic/$file" ]]; then
              echo "[error] failed to copy $file"
              exit 1
            fi
          done

          echo "[info] bundled ipadic from $dic_dir"

      - name: Bundle MeCab (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/bin
          mkdir -p src-tauri/resources/mecab/ipadic

          # mecab実行ファイル
          if ! command -v mecab >/dev/null 2>&1; then
            echo "[error] mecab not found on PATH"
            exit 1
          fi

          mecab_path="$(command -v mecab)"
          echo "[info] mecab path: $mecab_path"
          cp -f "$mecab_path" src-tauri/resources/bin/mecab.exe

          # DLL依存関係
          mecab_dir="$(dirname "$mecab_path")"
          echo "[info] copying DLLs from $mecab_dir"

          # 必要なDLLを直接コピー（lddよりも確実）
          cp -f "$mecab_dir"/libmecab*.dll src-tauri/resources/bin/ 2>/dev/null || true
          cp -f "$mecab_dir"/libgcc_s_seh*.dll src-tauri/resources/bin/ 2>/dev/null || true
          cp -f "$mecab_dir"/libstdc++*.dll src-tauri/resources/bin/ 2>/dev/null || true
          cp -f "$mecab_dir"/libwinpthread*.dll src-tauri/resources/bin/ 2>/dev/null || true

          echo "[info] bundled mecab.exe and DLLs"

          # 辞書ファイル（NAIST-JDIC）
          dic_dir=""
          if command -v mecab-config >/dev/null 2>&1; then
            dic_root="$(mecab-config --dicdir)"
            dic_dir="$dic_root/naist-jdic"
          fi

          if [[ -z "$dic_dir" || ! -d "$dic_dir" ]]; then
            for candidate in /mingw64/lib/mecab/dic/naist-jdic /mingw64/share/mecab/dic/naist-jdic; do
              if [[ -d "$candidate" ]]; then
                dic_dir="$candidate"
                break
              fi
            done
          fi

          if [[ ! -f "$dic_dir/dicrc" ]]; then
            echo "[error] naist-jdic not found"
            echo "[info] searched locations:"
            ls -la /mingw64/lib/mecab/dic 2>/dev/null || true
            ls -la /mingw64/share/mecab/dic 2>/dev/null || true
            exit 1
          fi

          # シンボリックリンクを解決して実ファイルをコピー
          rm -rf src-tauri/resources/mecab/ipadic/*
          cp -RL "$dic_dir"/* src-tauri/resources/mecab/ipadic/

          # 必須ファイルの確認
          for file in dicrc sys.dic unk.dic; do
            if [[ ! -f "src-tauri/resources/mecab/ipadic/$file" ]]; then
              echo "[error] failed to copy $file"
              exit 1
            fi
          done

          echo "[info] bundled naist-jdic from $dic_dir"

      - name: Bundle MeCab (macOS)
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/bin
          mkdir -p src-tauri/resources/mecab/ipadic

          # mecab実行ファイル
          if ! command -v mecab >/dev/null 2>&1; then
            echo "[error] mecab not found"
            exit 1
          fi

          cp -f "$(command -v mecab)" src-tauri/resources/bin/mecab
          chmod +x src-tauri/resources/bin/mecab
          echo "[info] bundled mecab binary"

          # 辞書ファイル
          if ! command -v mecab-config >/dev/null 2>&1; then
            echo "[error] mecab-config not found"
            exit 1
          fi

          dic_dir="$(mecab-config --dicdir)/ipadic"
          echo "[info] looking for ipadic at: $dic_dir"

          if [[ ! -d "$dic_dir" ]]; then
            echo "[error] ipadic directory not found at $dic_dir"
            echo "[info] available dictionaries:"
            ls -la "$(mecab-config --dicdir)" || true
            exit 1
          fi

          # 辞書ディレクトリの内容を確認
          echo "[info] ipadic contents:"
          ls -la "$dic_dir" || true

          # 必須ファイルの存在確認
          required_files=("dicrc" "sys.dic" "unk.dic")
          for file in "${required_files[@]}"; do
            if [[ ! -f "$dic_dir/$file" ]]; then
              echo "[error] required file not found: $dic_dir/$file"
              exit 1
            fi
          done

          # クリーンコピー（シンボリックリンクを解決して実ファイルをコピー）
          rm -rf src-tauri/resources/mecab/ipadic/*

          # -Lオプションでシンボリックリンクを辿って実ファイルをコピー
          cp -RL "$dic_dir"/* src-tauri/resources/mecab/ipadic/

          # コピー結果の確認
          echo "[info] bundled files:"
          ls -la src-tauri/resources/mecab/ipadic/ || true

          # 必須ファイルの最終確認
          for file in dicrc sys.dic unk.dic; do
            if [[ ! -f "src-tauri/resources/mecab/ipadic/$file" ]]; then
              echo "[error] failed to copy $file"
              exit 1
            fi
          done

          echo "[info] bundled ipadic from $dic_dir"

      # ========================================
      # Node / pnpm setup
      # ========================================

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # ========================================
      # Rust setup
      # ========================================

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ========================================
      # Build
      # ========================================

      - name: Build Tauri app (Linux/Windows)
        if: matrix.os != 'macos-14'
        run: pnpm tauri build

      - name: Build Tauri app (macOS)
        if: matrix.os == 'macos-14'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          CMAKE_OSX_DEPLOYMENT_TARGET: "11.0"
          CMAKE_ARGS: "-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
          GGML_NO_OPENMP: "1"
          WHISPER_NO_OPENMP: "1"
        run: pnpm tauri build -- --features no-openmp

      # ========================================
      # Upload artifacts
      # ========================================

      - name: Upload artifacts (main branch)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: falkoe-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle

      - name: Upload to GitHub Release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          fail_on_unmatched_files: false
