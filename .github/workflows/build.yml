name: Build and Release Falkoe

on:
  push:
    branches: [main]
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-14 # ← 追加（Apple Silicon）

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Linux deps (Tauri) ----
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libasound2-dev \
            build-essential \
            ffmpeg \
            praat \
            mecab \
            mecab-ipadic-utf8

      - name: Install tools (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          choco install -y ffmpeg praat

      - name: Setup MSYS2 (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-mecab
            mingw-w64-x86_64-mecab-naist-jdic

      - name: Ensure MeCab installed (MSYS2)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          set -euo pipefail

          pacman -S --noconfirm --needed mingw-w64-x86_64-mecab mingw-w64-x86_64-mecab-naist-jdic

          echo "[info] mecab packages:" 
          pacman -Q | grep -i mecab || true

          echo "[info] mecab exe candidates:" 
          ls -la /mingw64/bin/mecab.exe || true
          ls -la /usr/bin/mecab.exe || true

      - name: Install tools (macOS)
        if: matrix.os == 'macos-14'
        run: |
          brew update
          brew install ffmpeg
          brew install mecab mecab-ipadic
          brew install --cask praat

      - name: Bundle MeCab into resources (Windows only)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          set -euo pipefail

          mkdir -p src-tauri/resources/bin
          mkdir -p src-tauri/resources/mecab/ipadic

          if ! command -v mecab >/dev/null 2>&1; then
            echo "[error] mecab not found on PATH"
            echo "[info] PATH=$PATH"
            exit 1
          fi

          mecab_path="$(command -v mecab)"
          echo "[info] mecab path: $mecab_path"

          cp -f "$mecab_path" src-tauri/resources/bin/mecab.exe

          # Copy DLL dependencies. Prefer ldd if present; otherwise fall back to copying DLLs next to mecab.exe.
          mecab_dir="$(dirname "$mecab_path")"
          if command -v ldd >/dev/null 2>&1; then
            # Note: under MSYS2, ldd may exit non-zero even when output is usable.
            ldd_out="$(ldd "$mecab_path" 2>/dev/null || true)"
            echo "[info] ldd mecab.exe:"
            echo "$ldd_out"

            echo "$ldd_out" \
              | awk '{print $3}' \
              | grep -Ei '\\.dll$' \
              | grep -E '^(\/mingw64\/|\/ucrt64\/|\/clang64\/)' \
              | while read -r dll; do
                  if [ -f "$dll" ]; then
                    cp -f "$dll" src-tauri/resources/bin/
                  fi
                done
          else
            echo "[warn] ldd not available; copying dlls from $mecab_dir"
            cp -f "$mecab_dir"/*.dll src-tauri/resources/bin/ || true
          fi

          # Bundle dictionary (NAIST-JDIC) into resources/mecab/ipadic/
          dic_dir=""
          if command -v mecab-config >/dev/null 2>&1; then
            dic_root="$(mecab-config --dicdir)"
            dic_dir="$dic_root/naist-jdic"
          fi

          if [ -z "$dic_dir" ] || [ ! -d "$dic_dir" ]; then
            # Fallback: common locations under MSYS2 toolchains.
            dic_dir="$(ls -d /mingw64/lib/mecab/dic/naist-jdic /mingw64/share/mecab/dic/naist-jdic 2>/dev/null | head -n 1 || true)"
          fi

          if [ ! -f "$dic_dir/dicrc" ]; then
            echo "[error] dicrc not found at $dic_dir/dicrc"
            if [ -n "${dic_root:-}" ]; then
              echo "[info] dic_root=$dic_root"
              ls -la "$dic_root" || true
            fi
            ls -la /mingw64/lib/mecab/dic 2>/dev/null || true
            ls -la /mingw64/share/mecab/dic 2>/dev/null || true
            exit 1
          fi

          rm -rf src-tauri/resources/mecab/ipadic/*
          cp -R "$dic_dir"/* src-tauri/resources/mecab/ipadic/

      - name: Bundle ffmpeg + praat into resources/bin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/bin

          if [[ "$RUNNER_OS" == "Linux" ]]; then
            cp "$(command -v ffmpeg)" src-tauri/resources/bin/ffmpeg
            if command -v praatcon >/dev/null 2>&1; then
              cp "$(command -v praatcon)" src-tauri/resources/bin/praatcon
            fi
            cp "$(command -v praat)" src-tauri/resources/bin/praat
            chmod +x src-tauri/resources/bin/ffmpeg src-tauri/resources/bin/praat || true
            chmod +x src-tauri/resources/bin/praatcon || true
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            cp "$(command -v ffmpeg)" src-tauri/resources/bin/ffmpeg
            if command -v praatcon >/dev/null 2>&1; then
              cp "$(command -v praatcon)" src-tauri/resources/bin/praatcon
            fi
            cp "$(command -v praat)" src-tauri/resources/bin/praat
            chmod +x src-tauri/resources/bin/ffmpeg src-tauri/resources/bin/praat || true
            chmod +x src-tauri/resources/bin/praatcon || true
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            FFMPEG_PATH="$(where.exe ffmpeg | head -n 1 | tr -d '\r')"
            PRAAT_PATH="$(where.exe praat | head -n 1 | tr -d '\r')"
            cp "$FFMPEG_PATH" src-tauri/resources/bin/ffmpeg.exe
            cp "$PRAAT_PATH" src-tauri/resources/bin/praat.exe

            PRAATCON_PATH=""
            if where.exe praatcon > /dev/null 2>&1; then
              PRAATCON_PATH="$(where.exe praatcon | head -n 1 | tr -d '\r')"
              cp "$PRAATCON_PATH" src-tauri/resources/bin/praatcon.exe
            fi
          fi

      # ---- Node / pnpm ----
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # ---- Rust ----
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ---- Build (Linux / Windows) ----
      - name: Build Tauri app
        if: matrix.os != 'macos-14'
        run: pnpm tauri build

      # ---- Build (macOS: no-openmp) ----
      - name: Build Tauri app (macOS)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          CMAKE_OSX_DEPLOYMENT_TARGET: "11.0"
          CMAKE_ARGS: "-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
          GGML_NO_OPENMP: "1"
          WHISPER_NO_OPENMP: "1"
        run: |
          export MACOSX_DEPLOYMENT_TARGET=11.0
          export CMAKE_OSX_DEPLOYMENT_TARGET=11.0
          export CMAKE_ARGS="-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
          pnpm tauri build -- --features no-openmp

      # ---- Upload artifacts (mainブランチ) ----
      - name: Upload artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: falkoe-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle

      # ---- Create GitHub Release (タグpush時) ----
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          fail_on_unmatched_files: false
