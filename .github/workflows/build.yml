name: Build and Release Falkoe

on:
  push:
    branches: [main]
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-14 # ← 追加（Apple Silicon）

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Linux deps (Tauri) ----
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libasound2-dev \
            build-essential \
            ffmpeg \
            praat \
            mecab \
            mecab-ipadic-utf8

      - name: Install tools (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          choco install -y ffmpeg praat

      - name: Install MeCab (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          choco install -y mecab mecab-ipadic

      - name: Install tools (macOS)
        if: matrix.os == 'macos-14'
        run: |
          brew update
          brew install ffmpeg
          brew install mecab mecab-ipadic
          brew install --cask praat

      - name: Bundle MeCab into resources (binary + dictionary)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/bin
          mkdir -p src-tauri/resources/mecab/ipadic

          if [[ "$RUNNER_OS" == "Linux" || "$RUNNER_OS" == "macOS" ]]; then
            # Bundle mecab binary
            if command -v mecab >/dev/null 2>&1; then
              cp "$(command -v mecab)" "src-tauri/resources/bin/mecab"
              chmod +x "src-tauri/resources/bin/mecab" || true
            fi

            # Bundle dictionary (directory containing dicrc)
            DICDIR_BASE=""
            if command -v mecab-config >/dev/null 2>&1; then
              DICDIR_BASE="$(mecab-config --dicdir 2>/dev/null || true)"
            fi

            SRC_DIC=""
            if [[ -n "$DICDIR_BASE" ]]; then
              if [[ -f "$DICDIR_BASE/ipadic-utf8/dicrc" ]]; then
                SRC_DIC="$DICDIR_BASE/ipadic-utf8"
              elif [[ -f "$DICDIR_BASE/ipadic/dicrc" ]]; then
                SRC_DIC="$DICDIR_BASE/ipadic"
              fi
            fi

            # Fallback: search common locations
            if [[ -z "$SRC_DIC" ]]; then
              for C in \
                /var/lib/mecab/dic/ipadic-utf8 \
                /usr/lib/mecab/dic/ipadic \
                /usr/lib/x86_64-linux-gnu/mecab/dic/ipadic \
                /usr/local/lib/mecab/dic/ipadic \
                "/opt/homebrew/lib/mecab/dic/ipadic" \
                "/usr/local/lib/mecab/dic/ipadic"; do
                if [[ -f "$C/dicrc" ]]; then
                  SRC_DIC="$C"
                  break
                fi
              done
            fi

            if [[ -n "$SRC_DIC" ]]; then
              rm -rf src-tauri/resources/mecab/ipadic/*
              cp -R "$SRC_DIC"/* src-tauri/resources/mecab/ipadic/
            else
              echo "[warn] mecab dictionary not found; skipping dictionary bundling"
            fi
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            # Use PowerShell to locate real mecab.exe and dictionary dir.
            powershell -NoProfile -Command "
              \$ErrorActionPreference = 'Stop';
              New-Item -ItemType Directory -Force -Path 'src-tauri/resources/bin' | Out-Null;
              New-Item -ItemType Directory -Force -Path 'src-tauri/resources/mecab/ipadic' | Out-Null;

              function Find-File([string[]]\$Roots, [string]\$Name) {
                foreach (\$r in \$Roots) {
                  if (-not (Test-Path \$r)) { continue }
                  \$hit = Get-ChildItem -Path \$r -Recurse -Filter \$Name -ErrorAction SilentlyContinue | Select-Object -First 1;
                  if (\$hit) { return \$hit.FullName }
                }
                return \$null
              }

              # mecab.exe (prefer real binary, not the Chocolatey shim)
              \$mecabCmd = (Get-Command mecab -ErrorAction SilentlyContinue);
              \$mecabExe = \$null;
              if (\$mecabCmd -and (Test-Path \$mecabCmd.Source)) {
                \$mecabExe = \$mecabCmd.Source;
              }
              if (\$mecabExe -and (\$mecabExe -like '*\\chocolatey\\bin\\mecab.exe')) {
                \$mecabExe = \$null;
              }
              if (-not \$mecabExe) {
                \$mecabExe = Find-File @('C:\\Program Files\\MeCab', 'C:\\ProgramData\\chocolatey\\lib') 'mecab.exe'
              }
              if (\$mecabExe) {
                Copy-Item \"\$mecabExe\" 'src-tauri/resources/bin/mecab.exe' -Force;
                Write-Host \"[mecab] bundled exe: \$mecabExe\";
              } else {
                Write-Host '[warn] mecab.exe not found; skipping mecab bundling';
              }

              # Dictionary dir (directory containing dicrc; prefer ipadic)
              \$dicrc = Find-File @('C:\\Program Files\\MeCab', 'C:\\ProgramData\\chocolatey\\lib') 'dicrc';
              if (\$dicrc) {
                \$dicDir = Split-Path \$dicrc -Parent;
                Remove-Item -Recurse -Force 'src-tauri/resources/mecab/ipadic/*' -ErrorAction SilentlyContinue;
                Copy-Item -Recurse -Force (Join-Path \$dicDir '*') 'src-tauri/resources/mecab/ipadic/';
                Write-Host \"[mecab] bundled dicdir: \$dicDir\";
              } else {
                Write-Host '[warn] mecab dicrc not found; skipping dictionary bundling';
              }
            "
          fi

      - name: Bundle ffmpeg + praat into resources/bin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/bin

          if [[ "$RUNNER_OS" == "Linux" ]]; then
            cp "$(command -v ffmpeg)" src-tauri/resources/bin/ffmpeg
            if command -v praatcon >/dev/null 2>&1; then
              cp "$(command -v praatcon)" src-tauri/resources/bin/praatcon
            fi
            cp "$(command -v praat)" src-tauri/resources/bin/praat
            chmod +x src-tauri/resources/bin/ffmpeg src-tauri/resources/bin/praat || true
            chmod +x src-tauri/resources/bin/praatcon || true
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            cp "$(command -v ffmpeg)" src-tauri/resources/bin/ffmpeg
            if command -v praatcon >/dev/null 2>&1; then
              cp "$(command -v praatcon)" src-tauri/resources/bin/praatcon
            fi
            cp "$(command -v praat)" src-tauri/resources/bin/praat
            chmod +x src-tauri/resources/bin/ffmpeg src-tauri/resources/bin/praat || true
            chmod +x src-tauri/resources/bin/praatcon || true
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            FFMPEG_PATH="$(where.exe ffmpeg | head -n 1 | tr -d '\r')"
            PRAAT_PATH="$(where.exe praat | head -n 1 | tr -d '\r')"
            cp "$FFMPEG_PATH" src-tauri/resources/bin/ffmpeg.exe
            cp "$PRAAT_PATH" src-tauri/resources/bin/praat.exe

            PRAATCON_PATH=""
            if where.exe praatcon > /dev/null 2>&1; then
              PRAATCON_PATH="$(where.exe praatcon | head -n 1 | tr -d '\r')"
              cp "$PRAATCON_PATH" src-tauri/resources/bin/praatcon.exe
            fi
          fi

      # ---- Node / pnpm ----
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # ---- Rust ----
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ---- Build (Linux / Windows) ----
      - name: Build Tauri app
        if: matrix.os != 'macos-14'
        run: pnpm tauri build

      # ---- Build (macOS: no-openmp) ----
      - name: Build Tauri app (macOS)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          CMAKE_OSX_DEPLOYMENT_TARGET: "11.0"
          CMAKE_ARGS: "-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
          GGML_NO_OPENMP: "1"
          WHISPER_NO_OPENMP: "1"
        run: |
          export MACOSX_DEPLOYMENT_TARGET=11.0
          export CMAKE_OSX_DEPLOYMENT_TARGET=11.0
          export CMAKE_ARGS="-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
          pnpm tauri build -- --features no-openmp

      # ---- Upload artifacts (mainブランチ) ----
      - name: Upload artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: falkoe-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle

      # ---- Create GitHub Release (タグpush時) ----
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          fail_on_unmatched_files: false
