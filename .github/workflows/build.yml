name: Build and Release Falkoe

on:
  push:
    branches: [main]
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.canary || false }}
    env:
      # Human-friendly label for distribution artifacts.
      # Keep this in the matrix to avoid fragile expression logic.
      VARIANT_LABEL: ${{ matrix.label }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Default CPU builds
          - os: ubuntu-latest
            variant: default
            label: cpu
            canary: false
          - os: windows-latest
            variant: default
            label: cpu
            canary: false
          - os: macos-14
            variant: default
            label: cpu
            canary: false

          # Optional GPU build (macOS only): whisper.cpp Metal backend
          - os: macos-14
            variant: whisper-metal
            label: gpu-metal
            canary: false

          # Canary builds (macos-latest): catch breakages on new macOS/Xcode early.
          # Not uploaded to GitHub Releases.
          - os: macos-latest
            variant: default
            label: cpu-canary
            canary: true
          - os: macos-latest
            variant: whisper-metal
            label: gpu-metal-canary
            canary: true

          # Optional GPU build (Linux only): whisper.cpp Vulkan backend
          # Keep this as a separate artifact (not uploaded to GitHub Releases by default)
          # to avoid filename collisions with the default packages.
          - os: ubuntu-latest
            variant: whisper-vulkan
            label: gpu-vulkan
            canary: false

          # Optional GPU build (Windows only): whisper.cpp Vulkan backend
          - os: windows-latest
            variant: whisper-vulkan
            label: gpu-vulkan
            canary: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ========================================
      # 依存関係インストール
      # ========================================

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libasound2-dev \
            build-essential \
            ffmpeg \
            mecab \
            mecab-ipadic-utf8

          # Optional: Vulkan backend build deps for whisper.cpp
          if [[ "${{ matrix.variant }}" == "whisper-vulkan" ]]; then
            sudo apt install -y \
              cmake \
              libvulkan-dev

            # ggml-vulkan build expects `glslc` (shader compiler). Package names vary by distro.
            sudo apt install -y glslc || \
              sudo apt install -y shaderc || \
              sudo apt install -y shaderc-tools

            command -v glslc
          fi

      - name: Install tools (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          choco install -y ffmpeg

      - name: Install Vulkan SDK (Windows, whisper-vulkan)
        if: matrix.os == 'windows-latest' && matrix.variant == 'whisper-vulkan'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Provides Vulkan headers/libs and glslc (shader compiler) used by ggml-vulkan build.
          # NOTE: Chocolatey `vulkan-sdk` frequently breaks due to upstream URL changes.
          # Use winget (preinstalled on windows-latest) for a more stable install.
          winget --version
          winget install --id KhronosGroup.VulkanSDK -e --silent --accept-package-agreements --accept-source-agreements

          # Best-effort: locate the installed SDK folder and set VULKAN_SDK + PATH for subsequent steps.
          $sdk = Get-ChildItem -Path 'C:\VulkanSDK' -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $sdk) {
            throw "Vulkan SDK install succeeded but C:\\VulkanSDK was not found"
          }

          "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PATH=$($sdk.FullName)\\Bin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # Sanity check
          & "$($sdk.FullName)\\Bin\\glslc.exe" --version

      - name: Setup MSYS2 (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-mecab
            mingw-w64-x86_64-mecab-naist-jdic
            mingw-w64-x86_64-gettext

      - name: Verify MeCab installation (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          pacman -S --noconfirm --needed \
            mingw-w64-x86_64-mecab \
            mingw-w64-x86_64-mecab-naist-jdic \
            mingw-w64-x86_64-gettext
          echo "[info] mecab packages:" 
          pacman -Q | grep -i mecab || true
          echo "[info] mecab location:" 
          command -v mecab || true

      - name: Install tools (macOS)
        if: startsWith(matrix.os, 'macos-')
        run: |
          brew update
          brew install ffmpeg
          brew install mecab mecab-ipadic

      # ========================================
      # バンドル処理: ffmpeg
      # ========================================

      - name: Bundle ffmpeg (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/bin

          asset="ffmpeg-n8.0-latest-linux64-gpl-8.0.tar.xz"
          url="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/${asset}"
          tmpdir="$(mktemp -d)"

          curl -fsSL -o "$tmpdir/ffmpeg.tar.xz" "$url"
          tar -C "$tmpdir" -xf "$tmpdir/ffmpeg.tar.xz"

          ffdir="$(find "$tmpdir" -maxdepth 1 -type d -name 'ffmpeg-*' | head -n 1)"
          if [[ -z "$ffdir" || ! -f "$ffdir/bin/ffmpeg" ]]; then
            echo "[error] ffmpeg download/extract failed"
            exit 1
          fi

          cp -f "$ffdir/bin/ffmpeg" src-tauri/resources/bin/ffmpeg
          chmod +x src-tauri/resources/bin/ffmpeg
          echo "[info] bundled: $(src-tauri/resources/bin/ffmpeg -version | head -n1)"

          conf="$(src-tauri/resources/bin/ffmpeg -buildconf 2>/dev/null || true)"
          if ! grep -q -- '--enable-gpl' <<<"$conf"; then
            echo "[error] bundled ffmpeg is not a GPL build (--enable-gpl missing)"
            exit 1
          fi
          if grep -q -- '--enable-nonfree' <<<"$conf"; then
            echo "[error] bundled ffmpeg is nonfree (--enable-nonfree present); abort"
            exit 1
          fi

      - name: Bundle ffmpeg (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'src-tauri/resources/bin' | Out-Null

          $asset = 'ffmpeg-n8.0-latest-win64-gpl-shared-8.0.zip'
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$asset"
          $tmp = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          $zip = Join-Path $tmp $asset
          $out = Join-Path $tmp 'out'

          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          if (Test-Path $out) { Remove-Item -Recurse -Force $out }
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $out -Force

          $ffmpegExe = Get-ChildItem -Path $out -Recurse -File -Filter 'ffmpeg.exe' | Select-Object -First 1
          if (-not $ffmpegExe) { throw 'ffmpeg.exe not found in extracted archive' }
          $ffmpegDir = $ffmpegExe.Directory.FullName

          # Verify license-related build flags
          $ver = (& $ffmpegExe.FullName -version 2>&1 | Out-String)
          if ($ver -notmatch '--enable-gpl') { throw 'Bundled ffmpeg is not a GPL build (--enable-gpl missing)' }
          if ($ver -match '--enable-nonfree') { throw 'Bundled ffmpeg is nonfree (--enable-nonfree present); abort' }

          Copy-Item -Force $ffmpegExe.FullName 'src-tauri/resources/bin/ffmpeg.exe'
          Get-ChildItem -Path $ffmpegDir -Filter '*.dll' -File -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item -Force $_.FullName 'src-tauri/resources/bin/' }

          Write-Host "[info] bundled ffmpeg.exe (GPL build)"

      - name: Bundle ffmpeg (macOS)
        if: startsWith(matrix.os, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/bin

          curl -fsSL -o /tmp/ffmpeg.zip "https://evermeet.cx/ffmpeg/getrelease/zip"
          unzip -q -o /tmp/ffmpeg.zip -d /tmp/ffmpeg

          if [[ ! -f /tmp/ffmpeg/ffmpeg ]]; then
            echo "[error] ffmpeg unzip failed"
            exit 1
          fi

          cp -f /tmp/ffmpeg/ffmpeg src-tauri/resources/bin/ffmpeg
          chmod +x src-tauri/resources/bin/ffmpeg
          echo "[info] bundled: $(src-tauri/resources/bin/ffmpeg -version | head -n1)"

          conf="$(src-tauri/resources/bin/ffmpeg -buildconf 2>/dev/null || true)"
          if ! grep -q -- '--enable-gpl' <<<"$conf"; then
            echo "[error] bundled ffmpeg is not a GPL build (--enable-gpl missing)"
            exit 1
          fi
          if grep -q -- '--enable-nonfree' <<<"$conf"; then
            echo "[error] bundled ffmpeg is nonfree (--enable-nonfree present); abort"
            exit 1
          fi

      # ========================================
      # バンドル処理: WORLD helper (optional)
      # ========================================
      - name: Build + bundle WORLD helper (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/bin
          pushd src-tauri >/dev/null
          cargo build --release --bin world_pitch
          popd >/dev/null
          cp -f src-tauri/target/release/world_pitch src-tauri/resources/bin/world_pitch
          chmod +x src-tauri/resources/bin/world_pitch
          echo "[info] bundled WORLD helper: world_pitch"

      - name: Build + bundle WORLD helper (macOS)
        if: startsWith(matrix.os, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/bin
          pushd src-tauri >/dev/null
          cargo build --release --bin world_pitch
          popd >/dev/null
          cp -f src-tauri/target/release/world_pitch src-tauri/resources/bin/world_pitch
          chmod +x src-tauri/resources/bin/world_pitch
          echo "[info] bundled WORLD helper: world_pitch"

      - name: Build + bundle WORLD helper (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'src-tauri/resources/bin' | Out-Null
          pushd src-tauri
          cargo build --release --bin world_pitch
          popd
          Copy-Item -Force 'src-tauri/target/release/world_pitch.exe' 'src-tauri/resources/bin/world_pitch.exe'
          Write-Host "[info] bundled WORLD helper: world_pitch.exe"

      # ========================================
      # Praat
      # ========================================

      - name: Bundle Praat (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/bin

          asset="praat6452_linux-intel64-barren.tar.gz"
          url="https://www.fon.hum.uva.nl/praat/${asset}"
          tmpdir="$(mktemp -d)"

          curl -fsSL -o "$tmpdir/praat.tar.gz" "$url"
          tar -C "$tmpdir" -xzf "$tmpdir/praat.tar.gz"

          praat_bin=""
          if [[ -f "$tmpdir/praat" ]]; then
            praat_bin="$tmpdir/praat"
          elif [[ -f "$tmpdir/praat_barren" ]]; then
            praat_bin="$tmpdir/praat_barren"
          fi

          if [[ -z "$praat_bin" ]]; then
            echo "[error] praat binary not found after extract"
            ls -la "$tmpdir" || true
            exit 1
          fi

          cp -f "$praat_bin" src-tauri/resources/bin/praat
          chmod +x src-tauri/resources/bin/praat
          echo "[info] bundled praat (barren)"

      - name: Bundle Praat (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'src-tauri/resources/bin' | Out-Null

          $asset = 'praat6452_win-intel64.zip'
          $url = "https://www.fon.hum.uva.nl/praat/$asset"
          $tmp = Join-Path $env:RUNNER_TEMP 'praat'
          $zip = Join-Path $tmp $asset
          $out = Join-Path $tmp 'out'

          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          if (Test-Path $out) { Remove-Item -Recurse -Force $out }
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $out -Force

          $praatExe = Get-ChildItem -Path $out -Recurse -File -Filter 'Praat.exe' | Select-Object -First 1
          if (-not $praatExe) {
            $praatExe = Get-ChildItem -Path $out -Recurse -File -Filter 'praat.exe' | Select-Object -First 1
          }
          if (-not $praatExe) { throw 'Praat.exe not found in extracted archive' }

          Copy-Item -Force $praatExe.FullName 'src-tauri/resources/bin/praat.exe'
          Write-Host "[info] bundled praat.exe"

      - name: Bundle Praat (macOS)
        if: startsWith(matrix.os, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/bin

          asset="praat6452_mac.dmg"
          url="https://www.fon.hum.uva.nl/praat/${asset}"
          tmpdir="$(mktemp -d)"

          curl -fsSL -o "$tmpdir/praat.dmg" "$url"
          mnt="$tmpdir/mnt"
          mkdir -p "$mnt"

          hdiutil attach "$tmpdir/praat.dmg" -mountpoint "$mnt" -nobrowse -quiet
          # The DMG usually contains Praat.app (or Praat).
          if [[ -d "$mnt/Praat.app" && -f "$mnt/Praat.app/Contents/MacOS/Praat" ]]; then
            rm -rf src-tauri/resources/bin/Praat.app
            cp -R "$mnt/Praat.app" src-tauri/resources/bin/Praat.app
          elif [[ -f "$mnt/Praat" ]]; then
            cp -f "$mnt/Praat" src-tauri/resources/bin/praat.bin
          else
            ls -la "$mnt" || true
            hdiutil detach "$mnt" -quiet || true
            echo "[error] Praat app/binary not found in DMG"
            exit 1
          fi
          hdiutil detach "$mnt" -quiet

          # Tauri (tauri-build) walks bundled resources during build.
          # Ensure everything we copied is readable to avoid EACCES (os error 13).
          if [[ -d src-tauri/resources/bin/Praat.app ]]; then
            chmod -R a+rX src-tauri/resources/bin/Praat.app || true
          fi
          if [[ -f src-tauri/resources/bin/praat.bin ]]; then
            chmod a+rX src-tauri/resources/bin/praat.bin || true
          fi

          # Keep a stable entrypoint at src-tauri/resources/bin/praat
          cat > src-tauri/resources/bin/praat <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          here="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

          if [[ -x "$here/Praat.app/Contents/MacOS/Praat" ]]; then
            exec "$here/Praat.app/Contents/MacOS/Praat" "$@"
          elif [[ -x "$here/praat.bin" ]]; then
            exec "$here/praat.bin" "$@"
          else
            echo "[error] Praat not bundled correctly" >&2
            exit 1
          fi
          SH

          chmod +x src-tauri/resources/bin/praat
          if [[ -f src-tauri/resources/bin/praat.bin ]]; then
            chmod +x src-tauri/resources/bin/praat.bin
          fi

          # Best-effort: avoid Gatekeeper quarantine kills in CI.
          # (If the attribute doesn't exist, these no-op.)
          if command -v xattr >/dev/null 2>&1; then
            xattr -dr com.apple.quarantine src-tauri/resources/bin/Praat.app 2>/dev/null || true
            xattr -d com.apple.quarantine src-tauri/resources/bin/praat.bin 2>/dev/null || true
            xattr -d com.apple.quarantine src-tauri/resources/bin/praat 2>/dev/null || true
          fi

          echo "[info] bundled praat"

      # ========================================
      # バンドル処理: MeCab
      # ========================================

      - name: Bundle MeCab (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/bin
          mkdir -p src-tauri/resources/mecab/ipadic

          # mecab実行ファイル
          if ! command -v mecab >/dev/null 2>&1; then
            echo "[error] mecab not found"
            exit 1
          fi

          cp -f "$(command -v mecab)" src-tauri/resources/bin/mecab
          chmod +x src-tauri/resources/bin/mecab
          echo "[info] bundled mecab binary"

          # 辞書ファイル
          dic_dir=""
          for candidate in /var/lib/mecab/dic/ipadic /usr/share/mecab/dic/ipadic; do
            if [[ -d "$candidate" && -f "$candidate/dicrc" ]]; then
              dic_dir="$candidate"
              break
            fi
          done

          if [[ -z "$dic_dir" ]]; then
            echo "[error] ipadic not found"
            exit 1
          fi

          # シンボリックリンクを解決して実ファイルをコピー
          cp -RL "$dic_dir"/* src-tauri/resources/mecab/ipadic/

          # 必須ファイルの確認
          for file in dicrc sys.dic unk.dic; do
            if [[ ! -f "src-tauri/resources/mecab/ipadic/$file" ]]; then
              echo "[error] failed to copy $file"
              exit 1
            fi
          done

          echo "[info] bundled ipadic from $dic_dir"

      - name: Bundle MeCab (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/bin
          mkdir -p src-tauri/resources/mecab/ipadic

          # mecab実行ファイル
          if ! command -v mecab >/dev/null 2>&1; then
            echo "[error] mecab not found on PATH"
            exit 1
          fi

          mecab_path="$(command -v mecab)"
          echo "[info] mecab path: $mecab_path"
          cp -f "$mecab_path" src-tauri/resources/bin/mecab.exe

          # DLL依存関係
          mecab_dir="$(dirname "$mecab_path")"
          echo "[info] copying DLLs from $mecab_dir"

          # 必要なDLLを直接コピー（lddよりも確実）
          cp -f "$mecab_dir"/libmecab*.dll src-tauri/resources/bin/ 2>/dev/null || true
          cp -f "$mecab_dir"/libiconv-2.dll src-tauri/resources/bin/ 2>/dev/null || true
          cp -f "$mecab_dir"/libintl-8.dll src-tauri/resources/bin/ 2>/dev/null || true
          cp -f "$mecab_dir"/libcharset-1.dll src-tauri/resources/bin/ 2>/dev/null || true
          cp -f "$mecab_dir"/libgcc_s_seh*.dll src-tauri/resources/bin/ 2>/dev/null || true
          cp -f "$mecab_dir"/libstdc++*.dll src-tauri/resources/bin/ 2>/dev/null || true
          cp -f "$mecab_dir"/libwinpthread*.dll src-tauri/resources/bin/ 2>/dev/null || true

          # Fail early if critical deps are missing in the bundled directory.
          for dll in libmecab-2.dll libiconv-2.dll libintl-8.dll libcharset-1.dll; do
            if [[ ! -f "src-tauri/resources/bin/$dll" ]]; then
              echo "[error] missing required MeCab DLL in bundle: $dll"
              echo "[info] Hint: ensure MSYS2 deps are installed and copied from $mecab_dir"
              exit 1
            fi
          done

          echo "[info] bundled mecab.exe and DLLs (including libiconv/libintl)"

          # 辞書ファイル（IPA辞書）
          dic_dir=""
          echo "[info] searching for mecab dictionary..."

          if command -v mecab-config >/dev/null 2>&1; then
            dic_root="$(mecab-config --dicdir)"
            echo "[info] mecab-config --dicdir: $dic_root"
            for candidate in "$dic_root/ipadic" "$dic_root/ipadic-utf8" "$dic_root/naist-jdic"; do
              echo "[info] checking: $candidate"
              if [[ -d "$candidate" ]]; then
                dic_dir="$candidate"
                break
              fi
            done
          fi

          if [[ -z "$dic_dir" || ! -d "$dic_dir" ]]; then
            echo "[info] searching fallback locations..."
            for candidate in \
              /mingw64/lib/mecab/dic/ipadic \
              /mingw64/share/mecab/dic/ipadic \
              /mingw64/lib/mecab/dic/ipadic-utf8 \
              /mingw64/share/mecab/dic/ipadic-utf8 \
              /mingw64/lib/mecab/dic/naist-jdic \
              /mingw64/share/mecab/dic/naist-jdic
            do
              echo "[info] checking candidate: $candidate"
              if [[ -d "$candidate" ]]; then
                dic_dir="$candidate"
                echo "[info] found dictionary at: $dic_dir"
                break
              fi
            done
          fi

          if [[ -z "$dic_dir" || ! -f "$dic_dir/dicrc" ]]; then
            echo "[error] ipadic not found or invalid"
            echo "[info] searched locations:"
            ls -la /mingw64/lib/mecab/dic 2>/dev/null || echo "[info] /mingw64/lib/mecab/dic not found"
            ls -la /mingw64/share/mecab/dic 2>/dev/null || echo "[info] /mingw64/share/mecab/dic not found"
            echo "[info] Checking installed mecab packages:"
            pacman -Q | grep -i mecab || echo "[info] no mecab packages found"
            exit 1
          fi

          # シンボリックリンクを解決して実ファイルをコピー
          echo "[info] copying dictionary from $dic_dir to src-tauri/resources/mecab/ipadic/"
          rm -rf src-tauri/resources/mecab/ipadic/*
          cp -RL "$dic_dir"/* src-tauri/resources/mecab/ipadic/

          echo "[info] dictionary files copied:"
          ls -lh src-tauri/resources/mecab/ipadic/ | head -n 20

          # 必須ファイルの確認
          for file in dicrc sys.dic unk.dic; do
            if [[ ! -f "src-tauri/resources/mecab/ipadic/$file" ]]; then
              echo "[error] failed to copy $file"
              exit 1
            fi
          done

          echo "[info] bundled ipadic from $dic_dir"

      - name: Bundle MeCab (macOS)
        if: startsWith(matrix.os, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/bin
          mkdir -p src-tauri/resources/mecab/ipadic

          # mecab実行ファイル
          if ! command -v mecab >/dev/null 2>&1; then
            echo "[error] mecab not found"
            exit 1
          fi

          cp -f "$(command -v mecab)" src-tauri/resources/bin/mecab
          chmod +x src-tauri/resources/bin/mecab
          echo "[info] bundled mecab binary"

          # 辞書ファイル
          if ! command -v mecab-config >/dev/null 2>&1; then
            echo "[error] mecab-config not found"
            exit 1
          fi

          dic_dir="$(mecab-config --dicdir)/ipadic"
          echo "[info] looking for ipadic at: $dic_dir"

          if [[ ! -d "$dic_dir" ]]; then
            echo "[error] ipadic directory not found at $dic_dir"
            echo "[info] available dictionaries:"
            ls -la "$(mecab-config --dicdir)" || true
            exit 1
          fi

          # 辞書ディレクトリの内容を確認
          echo "[info] ipadic contents:"
          ls -la "$dic_dir" || true

          # 必須ファイルの存在確認
          required_files=("dicrc" "sys.dic" "unk.dic")
          for file in "${required_files[@]}"; do
            if [[ ! -f "$dic_dir/$file" ]]; then
              echo "[error] required file not found: $dic_dir/$file"
              exit 1
            fi
          done

          # クリーンコピー（シンボリックリンクを解決して実ファイルをコピー）
          rm -rf src-tauri/resources/mecab/ipadic/*

          # -Lオプションでシンボリックリンクを辿って実ファイルをコピー
          cp -RL "$dic_dir"/* src-tauri/resources/mecab/ipadic/

          # コピー結果の確認
          echo "[info] bundled files:"
          ls -la src-tauri/resources/mecab/ipadic/ || true

          # 必須ファイルの最終確認
          for file in dicrc sys.dic unk.dic; do
            if [[ ! -f "src-tauri/resources/mecab/ipadic/$file" ]]; then
              echo "[error] failed to copy $file"
              exit 1
            fi
          done

          echo "[info] bundled ipadic from $dic_dir"

      # ========================================
      # Node / pnpm setup
      # ========================================

      - name: Verify bundled tools (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          echo "[info] bundled tools directory listing:"
          ls -la src-tauri/resources/bin || true
          echo "[info] bundled praat scripts directory listing:"
          ls -la src-tauri/resources/praat || true

          # Required for all platforms in release builds
          test -e src-tauri/resources/bin/ffmpeg

          # Praat binary should be bundled (per project policy)
          test -e src-tauri/resources/bin/praat

          # On macOS, we bundle Praat.app and expose a wrapper at bin/praat.
          if [[ "${RUNNER_OS:-}" == "macOS" ]]; then
            test -x src-tauri/resources/bin/Praat.app/Contents/MacOS/Praat || test -x src-tauri/resources/bin/praat.bin
          fi

          # MeCab is optional in principle, but we bundle it in CI.
          test -e src-tauri/resources/bin/mecab
          test -e src-tauri/resources/mecab/ipadic/dicrc
          test -e src-tauri/resources/mecab/ipadic/sys.dic
          test -e src-tauri/resources/mecab/ipadic/unk.dic

          echo "[info] checksums (sha256):"
          (command -v sha256sum >/dev/null 2>&1 && sha256sum src-tauri/resources/bin/ffmpeg src-tauri/resources/bin/praat src-tauri/resources/bin/mecab) || true

      - name: Smoke test Praat (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          wav="$tmpdir/test.wav"
          out="$tmpdir/out.tsv"
          script="src-tauri/resources/praat/extract_pitch_to_tsv.praat"

          echo "[info] generating test wav with bundled ffmpeg"
          src-tauri/resources/bin/ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "sine=frequency=440:duration=1" -ac 1 -ar 16000 "$wav"

          echo "[info] running bundled praat --run"
          python3 - "$wav" "$out" <<'PY'
          import subprocess
          import sys

          cmd = [
              'src-tauri/resources/bin/praat',
              '--run',
              'src-tauri/resources/praat/extract_pitch_to_tsv.praat',
              sys.argv[1],
              sys.argv[2],
              '0.01',
              '75',
              '500',
          ]

          try:
              subprocess.run(cmd, check=True, timeout=15)
          except subprocess.TimeoutExpired:
              print('[error] Praat smoke test timed out', file=sys.stderr)
              raise
          PY

          if [[ ! -s "$out" ]]; then
            echo "[error] praat smoke test failed: output tsv missing/empty ($out)"
            ls -la "$tmpdir" || true
            exit 1
          fi
          echo "[info] praat smoke test ok: $(wc -l < "$out") lines"

      - name: Verify bundled tools (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "[info] bundled tools directory listing:"
          Get-ChildItem -Path 'src-tauri/resources/bin' -File | Sort-Object Name | Format-Table Name,Length
          Write-Host "[info] bundled praat scripts directory listing:"
          Get-ChildItem -Path 'src-tauri/resources/praat' -File | Sort-Object Name | Format-Table Name,Length

          # Required for all platforms in release builds
          if (!(Test-Path 'src-tauri/resources/bin/ffmpeg.exe')) { throw 'missing bundled ffmpeg.exe' }

          # Praat binary should be bundled (per project policy)
          if (!(Test-Path 'src-tauri/resources/bin/praat.exe')) { throw 'missing bundled praat.exe' }

          # MeCab is optional in principle, but we bundle it in CI.
          if (!(Test-Path 'src-tauri/resources/bin/mecab.exe')) { throw 'missing bundled mecab.exe' }
          foreach ($dll in @('libmecab-2.dll','libiconv-2.dll','libintl-8.dll','libcharset-1.dll')) {
            if (!(Test-Path (Join-Path 'src-tauri/resources/bin' $dll))) { throw "missing bundled MeCab DLL: $dll" }
          }
          foreach ($f in @('dicrc','sys.dic','unk.dic')) {
            if (!(Test-Path (Join-Path 'src-tauri/resources/mecab/ipadic' $f))) { throw "missing bundled MeCab dictionary file: $f" }
          }

          Write-Host "[info] checksums (sha256):"
          Get-FileHash 'src-tauri/resources/bin/ffmpeg.exe' -Algorithm SHA256 | Format-List
          Get-FileHash 'src-tauri/resources/bin/praat.exe' -Algorithm SHA256 | Format-List
          Get-FileHash 'src-tauri/resources/bin/mecab.exe' -Algorithm SHA256 | Format-List

      - name: Smoke test Praat (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tmp = Join-Path $env:RUNNER_TEMP 'praat-smoke'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $wav = Join-Path $tmp 'test.wav'
          $out = Join-Path $tmp 'out.tsv'
          $ffmpeg = Resolve-Path 'src-tauri/resources/bin/ffmpeg.exe'
          $praat = Resolve-Path 'src-tauri/resources/bin/praat.exe'
          $script = Resolve-Path 'src-tauri/resources/praat/extract_pitch_to_tsv.praat'

          Write-Host "[info] generating test wav with bundled ffmpeg"
          & $ffmpeg -hide_banner -loglevel error -y -f lavfi -i "sine=frequency=440:duration=1" -ac 1 -ar 16000 $wav

          Write-Host "[info] running bundled praat --run"
          $p = Start-Process -FilePath $praat -ArgumentList @('--run', $script, $wav, $out, '0.01', '75', '500') -PassThru
          $ok = $p.WaitForExit(15000)
          if (-not $ok) {
            try { $p.Kill() } catch {}
            throw 'Praat smoke test timed out'
          }
          if ($p.ExitCode -ne 0) {
            throw "Praat smoke test failed with exit code $($p.ExitCode)"
          }

          if (!(Test-Path $out)) { throw 'Praat smoke test failed: out.tsv not created' }
          if ((Get-Item $out).Length -le 0) { throw 'Praat smoke test failed: out.tsv is empty' }
          Write-Host "[info] praat smoke test ok"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # ========================================
      # Rust setup
      # ========================================

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Preflight permissions (macOS)
        if: startsWith(matrix.os, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          # tauri-build walks bundled resources; fail early if any are unreadable.
          if [[ ! -d src-tauri/resources ]]; then
            echo "[error] src-tauri/resources not found"
            exit 1
          fi

          echo "[info] quick resource permission diagnostics"
          ls -la src-tauri/resources || true
          ls -la src-tauri/resources/bin || true
          if [[ -d src-tauri/resources/bin/Praat.app ]]; then
            ls -la src-tauri/resources/bin/Praat.app || true
            ls -la src-tauri/resources/bin/Praat.app/Contents || true
            ls -la src-tauri/resources/bin/Praat.app/Contents/MacOS || true
          fi
          # Show any symlinks under resources/bin (symlinks can point outside and break tauri-build)
          find src-tauri/resources/bin -maxdepth 6 -type l -print 2>/dev/null || true

          echo "[info] scanning for unreadable files (before chmod)"
          python3 - <<'PY'
          import os
          import sys

          root = "src-tauri/resources"
          root_real = os.path.realpath(root)

          issues = []

          def add(kind: str, path: str, detail: str = ""):
            issues.append((kind, path, detail))

          def onerror(err):
            add("walk_error", getattr(err, "filename", ""), repr(err))

          for dirpath, dirnames, filenames in os.walk(root, onerror=onerror, followlinks=False):
            # Directory access matters too (need +x to traverse).
            if not os.access(dirpath, os.R_OK | os.X_OK):
              add("unreadable_dir", dirpath, "need R+X")

            for name in filenames:
              p = os.path.join(dirpath, name)
              try:
                # lstat first so we can reason about symlinks
                st = os.lstat(p)
              except OSError as e:
                add("lstat_failed", p, repr(e))
                continue

              if os.path.islink(p):
                # Diagnose where the link points, but don't fail just for being outside.
                target_real = os.path.realpath(p)
                if not (target_real == root_real or target_real.startswith(root_real + os.sep)):
                  add("symlink_outside_root", p, f"-> {target_real}")
                # Try opening through the symlink to catch actual PermissionError.
                try:
                  with open(p, "rb") as f:
                    f.read(1)
                except PermissionError as e:
                  add("unreadable_via_symlink", p, repr(e))
                except FileNotFoundError as e:
                  add("broken_symlink", p, repr(e))
                except OSError as e:
                  # Other errors are still valuable signal.
                  add("symlink_open_failed", p, repr(e))
                continue

              # Regular file: ensure we can actually open it.
              try:
                with open(p, "rb") as f:
                  f.read(1)
              except PermissionError as e:
                add("unreadable_file", p, repr(e))
              except OSError as e:
                add("open_failed", p, repr(e))

          for kind, path, detail in issues[:200]:
            if detail:
              print(f"{kind}: {path} {detail}")
            else:
              print(f"{kind}: {path}")

          if issues:
            print(f"[info] pre-chmod issues found: {len(issues)} (showing up to 200)", file=sys.stderr)
          PY

          echo "[info] normalizing permissions under src-tauri/resources"
          # Some bundled assets can end up copied as read-only.
          # If the build runs multiple times in the same workspace, overwrites can hit EACCES.
          chmod -R u+rwX,go+rX src-tauri/resources || true

          echo "[info] scanning for unreadable files (after chmod)"
          python3 - <<'PY'
          import os
          import sys

          root = "src-tauri/resources"
          root_real = os.path.realpath(root)

          issues = []

          def add(kind: str, path: str, detail: str = ""):
            issues.append((kind, path, detail))

          def onerror(err):
            add("walk_error", getattr(err, "filename", ""), repr(err))

          for dirpath, dirnames, filenames in os.walk(root, onerror=onerror, followlinks=False):
            if not os.access(dirpath, os.R_OK | os.X_OK):
              add("unreadable_dir", dirpath, "need R+X")

            for name in filenames:
              p = os.path.join(dirpath, name)
              try:
                os.lstat(p)
              except OSError as e:
                add("lstat_failed", p, repr(e))
                continue

              if os.path.islink(p):
                target_real = os.path.realpath(p)
                if not (target_real == root_real or target_real.startswith(root_real + os.sep)):
                  # Keep as diagnostic, but don't fail CI solely due to this.
                  add("symlink_outside_root", p, f"-> {target_real}")
                try:
                  with open(p, "rb") as f:
                    f.read(1)
                except PermissionError as e:
                  add("unreadable_via_symlink", p, repr(e))
                except FileNotFoundError as e:
                  add("broken_symlink", p, repr(e))
                except OSError as e:
                  add("symlink_open_failed", p, repr(e))
                continue

              try:
                with open(p, "rb") as f:
                  f.read(1)
              except PermissionError as e:
                add("unreadable_file", p, repr(e))
              except OSError as e:
                add("open_failed", p, repr(e))

          # Fail only on issues that can actually cause EACCES during resource walking.
          fail_kinds = {
            "walk_error",
            "unreadable_dir",
            "lstat_failed",
            "unreadable_file",
            "open_failed",
            "unreadable_via_symlink",
            "broken_symlink",
          }
          fail_issues = [i for i in issues if i[0] in fail_kinds]

          if fail_issues:
            print(f"[error] still found unreadable entries under {root}: {len(fail_issues)} (showing up to 200)", file=sys.stderr)
            for kind, path, detail in fail_issues[:200]:
              if detail:
                print(f"{kind}: {path} {detail}")
              else:
                print(f"{kind}: {path}")
            sys.exit(1)

          # Non-fatal diagnostics
          diag = [i for i in issues if i[0] == "symlink_outside_root"]
          if diag:
            print(f"[warn] symlinks pointing outside resources detected: {len(diag)} (showing up to 50)", file=sys.stderr)
            for kind, path, detail in diag[:50]:
              print(f"{kind}: {path} {detail}")
          PY

      # ========================================
      # Build
      # ========================================

      - name: Build Tauri app (Linux/Windows CPU)
        if: ${{ !startsWith(matrix.os, 'macos-') && matrix.variant == 'default' }}
        run: pnpm tauri build

      - name: Build Tauri app (Linux Vulkan)
        if: matrix.os == 'ubuntu-latest' && matrix.variant == 'whisper-vulkan'
        run: pnpm tauri build -- --features whisper-vulkan

      - name: Build Tauri app (Windows Vulkan)
        if: matrix.os == 'windows-latest' && matrix.variant == 'whisper-vulkan'
        shell: powershell
        env:
          # Work around MSBuild/CMake failures caused by very deep paths.
          # (e.g. FTK1011 unable to create .tlog files under CMake TryCompile dirs)
          CARGO_TARGET_DIR: D:\t
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force 'D:\t' | Out-Null

          pnpm tauri build -- --features whisper-vulkan

          # Copy bundles back to the default location expected by later steps.
          $src = 'D:\t\release\bundle'
          $dst = 'src-tauri\target\release\bundle'
          if (-not (Test-Path $src)) {
            throw "Expected bundle directory not found: $src"
          }
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item -Recurse -Force "$src\*" $dst

      # ========================================
      # Label bundle filenames (CPU/GPU)
      # ========================================

      - name: Label bundle filenames (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          label="${VARIANT_LABEL}"
          shopt -s nullglob
          for f in src-tauri/target/release/bundle/msi/*.msi; do
            mv "$f" "${f%.msi}-${label}.msi"
          done
          for f in src-tauri/target/release/bundle/nsis/*.exe; do
            mv "$f" "${f%.exe}-${label}.exe"
          done
          for f in src-tauri/target/release/bundle/appimage/*.AppImage; do
            mv "$f" "${f%.AppImage}-${label}.AppImage"
          done
          for f in src-tauri/target/release/bundle/deb/*.deb; do
            mv "$f" "${f%.deb}-${label}.deb"
          done
          for f in src-tauri/target/release/bundle/rpm/*.rpm; do
            mv "$f" "${f%.rpm}-${label}.rpm"
          done

      - name: Label bundle filenames (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $label = "${env:VARIANT_LABEL}"
          $patterns = @(
            'src-tauri/target/release/bundle/msi/*.msi',
            'src-tauri/target/release/bundle/nsis/*.exe'
          )
          foreach ($pattern in $patterns) {
            Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue | ForEach-Object {
              $newName = "$($_.BaseName)-$label$($_.Extension)"
              Rename-Item -Path $_.FullName -NewName $newName
            }
          }

      - name: Build Tauri app (macOS)
        if: startsWith(matrix.os, 'macos-') && matrix.variant == 'default'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          CMAKE_OSX_DEPLOYMENT_TARGET: "11.0"
          CMAKE_ARGS: "-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
          GGML_NO_OPENMP: "1"
          WHISPER_NO_OPENMP: "1"
          RUST_BACKTRACE: "1"
        run: pnpm tauri build -- --features no-openmp

      - name: Build Tauri app (macOS Metal)
        if: startsWith(matrix.os, 'macos-') && matrix.variant == 'whisper-metal'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          CMAKE_OSX_DEPLOYMENT_TARGET: "11.0"
          CMAKE_ARGS: "-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
          GGML_NO_OPENMP: "1"
          WHISPER_NO_OPENMP: "1"
          RUST_BACKTRACE: "1"
        run: pnpm tauri build -- --features whisper-metal,no-openmp

      - name: Label bundle filenames (macOS)
        if: startsWith(matrix.os, 'macos-') && (matrix.variant == 'default' || matrix.variant == 'whisper-metal')
        shell: bash
        run: |
          set -euo pipefail
          label="${VARIANT_LABEL}"
          shopt -s nullglob
          for f in src-tauri/target/release/bundle/dmg/*.dmg; do
            mv "$f" "${f%.dmg}-${label}.dmg"
          done

      # ========================================
      # Upload artifacts
      # ========================================

      # upload-artifact occasionally fails with transient network errors (e.g. ECONNRESET).
      # Retry a few times before failing the job.
      - name: Upload artifacts (main branch) (attempt 1)
        id: upload_artifacts_1
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: falkoe-${{ matrix.os }}-${{ env.VARIANT_LABEL }}
          overwrite: true
          path: |
            src-tauri/target/release/bundle

      - name: Upload artifacts (main branch) (attempt 2)
        id: upload_artifacts_2
        if: github.ref == 'refs/heads/main' && steps.upload_artifacts_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: falkoe-${{ matrix.os }}-${{ env.VARIANT_LABEL }}
          overwrite: true
          path: |
            src-tauri/target/release/bundle

      - name: Upload artifacts (main branch) (attempt 3)
        id: upload_artifacts_3
        if: github.ref == 'refs/heads/main' && steps.upload_artifacts_2.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: falkoe-${{ matrix.os }}-${{ env.VARIANT_LABEL }}
          overwrite: true
          path: |
            src-tauri/target/release/bundle

      - name: Fail if artifact upload failed
        if: github.ref == 'refs/heads/main' && !matrix.canary && steps.upload_artifacts_3.outcome == 'failure'
        shell: bash
        run: |
          echo "[error] upload-artifact failed after 3 attempts"
          exit 1

      - name: Upload to GitHub Release (tags)
        if: startsWith(github.ref, 'refs/tags/') && !matrix.canary
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          fail_on_unmatched_files: false
