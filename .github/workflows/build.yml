name: Build and Release Falkoe

on:
  push:
    branches: [main]
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-14 # ← 追加（Apple Silicon）

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Linux deps (Tauri) ----
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libasound2-dev \
            build-essential \
            ffmpeg \
            praat \
            mecab \
            mecab-ipadic-utf8

      - name: Install tools (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          choco install -y ffmpeg praat

      - name: Setup MSYS2 (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-mecab
            mingw-w64-x86_64-mecab-naist-jdic

      - name: Install tools (macOS)
        if: matrix.os == 'macos-14'
        run: |
          brew update
          brew install ffmpeg
          brew install mecab mecab-ipadic
          brew install --cask praat

      - name: Bundle MeCab into resources (Windows only)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Force -Path 'src-tauri/resources/bin' | Out-Null
          New-Item -ItemType Directory -Force -Path 'src-tauri/resources/mecab/ipadic' | Out-Null

          # MSYS2 install root varies (C:\\msys64 is common but not guaranteed).
          $candidateRoots = @(
            $env:MSYS2_ROOT,
            $env:MSYS2_LOCATION,
            'C:\\msys64',
            'D:\\msys64'
          ) | Where-Object { $_ -and (Test-Path $_) }

          $msysRoot = $candidateRoots | Select-Object -First 1
          if (-not $msysRoot) {
            throw "MSYS2 root not found. Tried env(MSYS2_ROOT/MSYS2_LOCATION) and common paths."
          }

          # Look for mecab.exe in typical MSYS2 toolchains.
          $binCandidates = @(
            (Join-Path $msysRoot 'mingw64\\bin'),
            (Join-Path $msysRoot 'ucrt64\\bin'),
            (Join-Path $msysRoot 'clang64\\bin'),
            (Join-Path $msysRoot 'usr\\bin')
          )

          $toolBin = $null
          $mecabExe = $null
          foreach ($bin in $binCandidates) {
            $candidate = Join-Path $bin 'mecab.exe'
            if (Test-Path $candidate) {
              $toolBin = $bin
              $mecabExe = $candidate
              break
            }
          }

          if (-not $mecabExe) {
            throw "mecab.exe not found under $msysRoot (searched: $($binCandidates -join ', '))"
          }

          Copy-Item $mecabExe 'src-tauri/resources/bin/mecab.exe' -Force

          # Copy a minimal set of runtime DLLs next to mecab.exe.
          # mecab.exe loads DLLs from its own directory first.
          $dlls = @(
            'libmecab-2.dll',
            'libiconv-2.dll',
            'libgcc_s_seh-1.dll',
            'libstdc++-6.dll',
            'libwinpthread-1.dll'
          )
          foreach ($dll in $dlls) {
            $src = Join-Path $toolBin $dll
            if (Test-Path $src) {
              Copy-Item $src (Join-Path 'src-tauri/resources/bin' $dll) -Force
            } else {
              Write-Host "[warn] missing dll: $src"
            }
          }

          # Bundle dictionary (NAIST-JDIC) into resources/mecab/ipadic/
          $dicCandidates = @(
            (Join-Path $msysRoot 'mingw64\\lib\\mecab\\dic\\naist-jdic'),
            (Join-Path $msysRoot 'ucrt64\\lib\\mecab\\dic\\naist-jdic'),
            (Join-Path $msysRoot 'clang64\\lib\\mecab\\dic\\naist-jdic'),
            (Join-Path $msysRoot 'usr\\lib\\mecab\\dic\\naist-jdic')
          )
          $dicDir = $dicCandidates | Where-Object { Test-Path (Join-Path $_ 'dicrc') } | Select-Object -First 1
          if (-not $dicDir) {
            throw "MeCab dictionary (naist-jdic) not found under $msysRoot. Tried: $($dicCandidates -join ', ')"
          }

          Remove-Item -Recurse -Force 'src-tauri/resources/mecab/ipadic/*' -ErrorAction SilentlyContinue
          Copy-Item -Recurse -Force (Join-Path $dicDir '*') 'src-tauri/resources/mecab/ipadic/'

      - name: Bundle ffmpeg + praat into resources/bin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/bin

          if [[ "$RUNNER_OS" == "Linux" ]]; then
            cp "$(command -v ffmpeg)" src-tauri/resources/bin/ffmpeg
            if command -v praatcon >/dev/null 2>&1; then
              cp "$(command -v praatcon)" src-tauri/resources/bin/praatcon
            fi
            cp "$(command -v praat)" src-tauri/resources/bin/praat
            chmod +x src-tauri/resources/bin/ffmpeg src-tauri/resources/bin/praat || true
            chmod +x src-tauri/resources/bin/praatcon || true
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            cp "$(command -v ffmpeg)" src-tauri/resources/bin/ffmpeg
            if command -v praatcon >/dev/null 2>&1; then
              cp "$(command -v praatcon)" src-tauri/resources/bin/praatcon
            fi
            cp "$(command -v praat)" src-tauri/resources/bin/praat
            chmod +x src-tauri/resources/bin/ffmpeg src-tauri/resources/bin/praat || true
            chmod +x src-tauri/resources/bin/praatcon || true
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            FFMPEG_PATH="$(where.exe ffmpeg | head -n 1 | tr -d '\r')"
            PRAAT_PATH="$(where.exe praat | head -n 1 | tr -d '\r')"
            cp "$FFMPEG_PATH" src-tauri/resources/bin/ffmpeg.exe
            cp "$PRAAT_PATH" src-tauri/resources/bin/praat.exe

            PRAATCON_PATH=""
            if where.exe praatcon > /dev/null 2>&1; then
              PRAATCON_PATH="$(where.exe praatcon | head -n 1 | tr -d '\r')"
              cp "$PRAATCON_PATH" src-tauri/resources/bin/praatcon.exe
            fi
          fi

      # ---- Node / pnpm ----
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # ---- Rust ----
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ---- Build (Linux / Windows) ----
      - name: Build Tauri app
        if: matrix.os != 'macos-14'
        run: pnpm tauri build

      # ---- Build (macOS: no-openmp) ----
      - name: Build Tauri app (macOS)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          CMAKE_OSX_DEPLOYMENT_TARGET: "11.0"
          CMAKE_ARGS: "-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
          GGML_NO_OPENMP: "1"
          WHISPER_NO_OPENMP: "1"
        run: |
          export MACOSX_DEPLOYMENT_TARGET=11.0
          export CMAKE_OSX_DEPLOYMENT_TARGET=11.0
          export CMAKE_ARGS="-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
          pnpm tauri build -- --features no-openmp

      # ---- Upload artifacts (mainブランチ) ----
      - name: Upload artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: falkoe-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle

      # ---- Create GitHub Release (タグpush時) ----
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          fail_on_unmatched_files: false
